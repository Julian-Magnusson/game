  easy: Object.freeze({ label: 'Easy', gate: 1, ring: 1, pad: 1, minObstacles: 0 }),
  medium: Object.freeze({ label: 'Medium', gate: 1, ring: 1, pad: 1, minObstacles: 1 }),
  hard: Object.freeze({ label: 'Hard', gate: 0.7, ring: 0.7, pad: 0.85, minObstacles: 2 }),
  extreme: Object.freeze({ label: 'Extreme', gate: 0.55, ring: 0.55, pad: 0.75, minObstacles: 0 }),
});

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const laneEase = t => (1 - Math.cos(Math.PI * t)) / 2;

const ALLEY_OFFSET = 48;             // from an avenue centre to the street between ordinary blocks
const ALLEY_SHOULDER = 112;          // cosine shift bends no tighter than ~53-u turn radius
const ALLEY_WALL_MARGIN = 16;        // leave the bends free of new walls
const ALLEY_WALL_LENGTH = 13;        // neighboring 32-u blocks leave a visible 6-u facade gap
const ALLEY_WALL_RISE = 22;          // the buildings flank the player, rather than end below them
const ALLEY_CORNER_HALF = 13;         // a 6-u gap to the next facade, also around a junction
const ALLEY_CORNER_CLEARANCE = 9.5;   // room for steering around the curved flight line
const ALLEY_TURN_MARGIN = 24;        // keep the outside turn clear but carry facades close to its ends
const HARD_STREETS = Object.freeze({ wallHalf: 6.5, width: 19, maxLength: 600, minTurnWindow: 520,
  minFlank: 150, curveFlank: 40, minCount: 6, maxCount: 8, minTurns: 4,
  minShare: 0.20, gap: 0, minProps: 2, minPipes: 2, minZigzags: 4, minBridges: 30, minActiveBridges: 1,
  guards: true, islandHalf: 11.5, weave: 0 });
const EXTREME_STREETS = Object.freeze({ wallHalf: 6.5, width: 19, shoulder: 0,
  minFlank: 3000, curveFlank: 40, minCount: 1, minTurns: 7, minShare: 0.55,
  minProps: 6, minPipes: 6, minZigzags: 4, minBridges: 60, minActiveBridges: 1,
  guards: false, islandHalf: 11.5, weave: 0 });
const STREETS = Object.freeze({
  medium: Object.freeze({ wallHalf: 3, width: 26, maxLength: 760, minTurnWindow: 560,
    minFlank: 140, curveFlank: 32, minCount: 2, maxCount: 3, minTurns: 1,
    minShare: 0.08, gap: 240, minProps: 1, minPipes: 1, minZigzags: 0, minBridges: 3, minActiveBridges: 1,
    guards: false, islandHalf: 8.5, weave: 2 }),
  hard: HARD_STREETS,
  extreme: EXTREME_STREETS,
});

// A plan for the route: its sections laid front to back, rejected when a gate crowds a booster.
function plan(city, pts, legs, r) {
  const P = createPlan(city, pts, legs[legs.length - 1]);
  sections.lay(P, legs, r);
  advance(P, P.n - 1);
  P.error ??= crowdedBooster(P);
  return P;
}

// ---- The line and its proof --------------------------------------------------------------------
// Eases between keys (height and lateral offset independently); arcs keep to the avenue's centre.
// A key marked linear is reached in a straight line: a beam lifts at a constant rate.
function interpolate(keys, field, n) {
  const out = new Float32Array(n);
  let ki = 0;
  for (let k = 0; k < n; k++) {
    while (ki < keys.length - 2 && keys[ki + 1].k <= k) ki++;
    const a = keys[ki], b = keys[Math.min(ki + 1, keys.length - 1)];
    const t = b.k > a.k ? clamp((k - a.k) / (b.k - a.k), 0, 1) : 1;
    out[k] = lerp(a[field], b[field], b.linear ? t : smooth(t));
  }
  return out;
}

function route3d(P) {
  const { pts, n, E } = P;
  const heights = P.heights.map(h => ({ k: h.k, y: keyY(P, h), linear: h.linear })).sort((a, b) => a.k - b.k);
  const laterals = [...P.laterals];
  for (let k = 1; k < n; k++) if (pts[k].arc !== pts[k - 1].arc) laterals.push({ k: pts[k].arc ? k - 1 : k, lateral: 0 });
  laterals.sort((a, b) => a.k - b.k);
  const yk = interpolate(heights, 'y', n), lat = interpolate(laterals, 'lateral', n);
  const x = new Float32Array(n), y = new Float32Array(n), z = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    const p = pts[k];
    x[k] = p.x - p.dz * lat[k];   // right of heading (dx, dz) is (-dz, dx)
    z[k] = p.z + p.dx * lat[k];
    y[k] = Math.min(yk[k], E[k] - 2);
  }
  return { x, y, z, n };
}

// Where the route or a gate ring would touch the city, or null when everything is clear.
function blocked(city, line, gates) {
  for (let k = 0; k < line.n; k++) {
    if (GAME.collide.sphere(city, line.x[k], line.y[k], line.z[k], CLEARANCE)) return `route at ${k * SAMPLE}`;
  }
  for (const g of gates) if (!ringClear(city, g)) return `gate ${g.index}`;
  return null;
}

function avenueObstacles(city, line) {
  const cells = new Set();
  for (let k = 0; k < line.n; k++) {
    const cell = city.cellIndex(line.x[k], line.z[k]);
    if (city.kind[cell] === city.KIND.OBSTACLE) cells.add(cell);
  }
  return cells.size;
}

// A route and the best of a few plans for it.
function design(city, r) {
  const corners = city.difficulty === 'extreme' ? walkExtreme(city, r) : walk(city, r);
  if (!corners) return { error: 'no route fits the city' };
  const pts = centreline(corners), legs = straights(pts);
  let best = null;
  for (let i = 0; i < PLANS; i++) {
    const P = plan(city, pts, legs, r);
    if (!P.error && (!best || sections.score(P) > sections.score(best))) best = P;
    if (!best && i === PLANS - 1) return { error: P.error };
  }
  return { P: best, pts };
}

function build(city, r, attempt, difficulty) {
  const { P, pts, error } = design(city, r);
  if (error) return { error };
  const line = route3d(P);
  const tangent = k => [pts[k].dx, 0, pts[k].dz];
  const obstacles = avenueObstacles(city, line);
  if (obstacles < difficulty.minObstacles) return { error: `only ${obstacles} avenue obstacles on the route` };

  const gateObjs = P.gates.map((g, i) => ({
    index: i, x: line.x[g.k], y: line.y[g.k], z: line.z[g.k], n: tangent(g.k), radius: g.radius * difficulty.gate,
    s: g.k * SAMPLE, finish: g.finish,
  }));
  // Extreme moves this entire provisional avenue line into the neighboring streets. Test its
  // actual collision boxes after that shift, rather than rejecting harmless avenue intrusions.
  const bad = city.difficulty === 'extreme' ? null : blocked(city, line, gateObjs);
  if (bad) return { error: `blocked: ${bad}` };

  const boosterObjs = P.boosters.map((b, i) => {
    // Its lift and the height it takes you to (top), where the lift starts (pickup) and has been
    // delivered at cruise (climbEnd), and its landing gate: the first gate after it.
    const lift = { lift: b.lift, top: b.top, pickup: b.k * SAMPLE, climbEnd: (b.k + b.spread) * SAMPLE, landing: b.landing };
    if (b.type === 'ring') return { id: i, type: 'ring', x: line.x[b.k], y: line.y[b.k], z: line.z[b.k], n: tangent(b.k), radius: ringRadius(b.lift) * difficulty.ring, s: b.k * SAMPLE, ...lift };
    const cell = city.cellIndex(line.x[b.centre], line.z[b.centre]);
    const [cx, cz] = city.cellCenter(cell);
    return { id: i, type: 'pad', cell, x: cx, z: cz, radius: PAD.radius * difficulty.pad, height: PAD.height, s: b.centre * SAMPLE, ...lift };
  });
  const blockedRing = city.difficulty === 'extreme' ? null
    : boosterObjs.find(b => b.type === 'ring' && !ringClear(city, b));
  if (blockedRing) return { error: `blocked: boost ring ${blockedRing.id}` };
  const blockedPad = boosterObjs.find(b => b.type === 'pad' && city.kind[b.cell] === city.KIND.OBSTACLE);
  if (blockedPad) return { error: `blocked: pad ${blockedPad.id}` };
  const p0 = pts[0], total = (pts.length - 1) * SAMPLE, E = P.E;
  return {
    pts,
    course: {
      attempt,
      pts,
      start: { x: line.x[0], y: START_ALT, z: line.z[0], yaw: Math.atan2(p0.dx, p0.dz) },
      gates: gateObjs,
      boosters: boosterObjs,
      pads: boosterObjs.filter(b => b.type === 'pad'),
      obstacles,
      sections: P.sections.map(s => ({ type: s.type, s0: s.k0 * SAMPLE, s1: s.k1 * SAMPLE })),
      line, length: total, sample: SAMPLE,
      energyAt: s => E[clamp(Math.round(s / SAMPLE), 0, E.length - 1)],
      par: total / GAME.flight.cruise(city.difficulty),
    },
  };
}

// Beam pads stay at their fixed ground cells. Boost rings move with the line, so their stretches
// can also contain a minor-street passage. A passage through a turn joins two different streets.
function routeTurns(pts, sample) {
  const turns = [];
  for (let k = 0; k < pts.length; k++) {
    if (!pts[k].arc) continue;
    const first = k;
    while (k + 1 < pts.length && pts[k + 1].arc) k++;
    const a = pts[Math.max(0, first - 1)], b = pts[Math.min(pts.length - 1, k + 1)];
    const cross = a.dx * b.dz - a.dz * b.dx;
    turns.push({ s0: first * sample, s1: k * sample, side: -Math.sign(cross), angle: Math.acos(clamp(a.dx * b.dx + a.dz * b.dz, -1, 1)) });
  }
  return turns;
}

function alleyWindows(course, pts, profile) {
  const sample = course.sample, turns = routeTurns(pts, sample);
  const end = course.gates.at(-1).s - 72;
  let free = [[96, end]];
  for (const b of course.boosters.filter(b => b.type === 'pad')) {
    const lo = b.s - 40, hi = b.s + 40;
    free = free.flatMap(([a, z]) => hi <= a || lo >= z ? [[a, z]]
      : [[a, Math.min(z, lo)], [Math.max(a, hi), z]].filter(([x, y]) => y > x));
  }
  return free.filter(([a, z]) => z - a >= 400).map(([a, z]) => {
    const options = [], seen = new Set();
    const add = (centre, len, turn = null, lo = a, hi = z) => {
      const s0 = Math.round(clamp(centre - len / 2, lo, hi - len) / sample) * sample;
      const s1 = s0 + len, key = `${s0}:${s1}`;
      if (seen.has(key)) return;
      const inside = turns.filter(t => t.s0 < s1 && t.s1 > s0);
      if (turn ? inside.length !== 1 || inside[0] !== turn
        || turn.s0 - s0 < ALLEY_SHOULDER + ALLEY_WALL_MARGIN + profile.curveFlank + ALLEY_TURN_MARGIN
        || s1 - turn.s1 < ALLEY_SHOULDER + ALLEY_WALL_MARGIN + profile.curveFlank + ALLEY_TURN_MARGIN
        : inside.length) return;
      seen.add(key);
      options.push({ s0, s1, turns: inside, section: course.sections.find(v => v.s0 <= centre && v.s1 >= centre)?.type || 'turn' });
    };
    // Keep just one arc in a connected passage. The full straight approaches on either side are
    // useful walling; centering a short fixed window on the arc used to leave only a few seconds
    // of genuinely narrow flight.
    for (let i = 0; i < turns.length; i++) {
      const turn = turns[i];
      if (!turn.side || turn.angle <= Math.PI / 3 || turn.s0 < a || turn.s1 > z) continue;
      const lo = Math.max(a, i ? turns[i - 1].s1 + sample : a);
      const hi = Math.min(z, i + 1 < turns.length ? turns[i + 1].s0 - sample : z);
      const len = Math.min(profile.maxLength, Math.floor((hi - lo) / sample) * sample);
      if (len < profile.minTurnWindow) continue;
      const mid = (turn.s0 + turn.s1) / 2;
      add(mid, len, turn, lo, hi);
      // Alternate alignments can fit a ring or high tower when the first side does not.
      if (hi - lo > len + 24) {
        add(lo + len / 2, len, turn, lo, hi);
        add(hi - len / 2, len, turn, lo, hi);
      }
    }
    let from = a;
    for (const turn of [...turns.filter(t => t.s0 < z && t.s1 > a), { s0: z, s1: z }]) {
      const to = Math.min(z, turn.s0);
      const straightLen = Math.min(profile.maxLength, Math.floor((to - from) / sample) * sample);
      if (straightLen >= 400) for (const f of [0.5, 0.1, 0.9])
        add(from + (to - from) * f, straightLen, null, from, to);
      from = Math.max(from, turn.s1 + sample);
    }
    options.sort((u, v) => (v.turns.length - u.turns.length) || ((v.s1 - v.s0) - (u.s1 - u.s0)));
    return { a, z, options };
  });
}

function alleyCandidate(course, pts, window, side, profile) {
  const { s0, s1 } = window, L = course.line, sample = course.sample;
  const k0 = Math.round(s0 / sample), k1 = Math.round(s1 / sample);
  const shoulder = profile.shoulder ?? ALLEY_SHOULDER;
  const x = Float32Array.from(L.x), z = Float32Array.from(L.z);
  for (let k = k0; k <= k1; k++) {
    const s = k * sample;
    const amount = shoulder && s < s0 + shoulder ? laneEase((s - s0) / shoulder)
      : shoulder && s > s1 - shoulder ? laneEase((s1 - s) / shoulder) : 1;
    const p = pts[k];
    // Medium adds a gentle weave on the two approaches. Hard's tighter walls leave the line
    // centred; its turn island and pipes on alternating sides create the steering challenge.
    let weave = 0;
    if (profile.weave) for (const turn of window.turns) {
      const bump = centre => {
        const u = Math.abs(s - centre) / 54;
        return u < 1 ? (1 + Math.cos(Math.PI * u)) / 2 : 0;
      };
      weave += profile.weave * turn.side * (bump(turn.s0 - 80) - bump(turn.s1 + 80));
    }
    x[k] = lerp(x[k], p.x - p.dz * side * ALLEY_OFFSET, amount) - p.dz * weave;
    z[k] = lerp(z[k], p.z + p.dx * side * ALLEY_OFFSET, amount) + p.dx * weave;
  }
  const line = { ...L, x, z };
  const gates = course.gates.map(g => {
    const k = Math.round(g.s / sample);
    if (k < k0 || k > k1) return g;
    const a = Math.max(0, k - 2), b = Math.min(L.n - 1, k + 2);
    const dx = x[b] - x[a], dz = z[b] - z[a], len = Math.hypot(dx, dz);
    return { ...g, x: x[k], z: z[k], n: [dx / len, 0, dz / len] };
  });
  const boosters = course.boosters.map(b => {
    const k = Math.round(b.s / sample);
    if (b.type !== 'ring' || k < k0 || k > k1) return b;
    const a = Math.max(0, k - 2), z1 = Math.min(L.n - 1, k + 2);
    const dx = x[z1] - x[a], dz = z[z1] - z[a], len = Math.hypot(dx, dz);
    return { ...b, x: x[k], z: z[k], n: [dx / len, 0, dz / len] };
  });
  return { line, gates, boosters, k0, k1 };
}

// A wall or a cleared turn pocket changes the same boxes used by rendering and collision.
// Each passage remembers the state it found; reverse-order undo handles overlapping cells.
function saveAlleyCell(city, patch, i) {
  if (patch.saved.has(i)) return;
  const a = i * 4;
  patch.saved.set(i, { i, kind: city.kind[i], boxA: city.boxA.slice(a, a + 4), boxB: city.boxB.slice(a, a + 4) });
}

function undoAlleyWalls(city, patch) {
  if (patch.patches) {
    for (let i = patch.patches.length - 1; i >= 0; i--) undoAlleyWalls(city, patch.patches[i]);
    return;
  }
  for (const { i, kind, boxA, boxB } of patch.saved.values()) {
    const a = i * 4;
    city.kind[i] = kind;
    city.boxA.set(boxA, a);
    city.boxB.set(boxB, a);
  }
  city.maxHeight = patch.oldMaxHeight;
}

const nearTurn = (s, turns) => turns.some(t => s >= t.s0 - ALLEY_TURN_MARGIN && s <= t.s1 + ALLEY_TURN_MARGIN);

// The original avenue intersection has no buildings beside the rounded line. Fill several of
// its unused cells with ordinary tower boxes, on both sides of the bend. Keep every box inside
// its own cell so its facade stays separated from its neighbours, as on the straight streets.
// A candidate is optional: an obstacle, marker or another part of the route may use that cell.
function addCornerGuards(city, course, window, candidate, patch, reserved) {
  const { line, gates, boosters } = candidate;
  const marker = [...gates, ...boosters.filter(b => b.type === 'ring')];
  for (const turn of window.turns) {
    const middle = Math.round((turn.s0 + turn.s1) / (2 * course.sample));
    const first = Math.ceil((turn.s0 + 8) / course.sample);
    const last = Math.floor((turn.s1 - 8) / course.sample);
    const samples = [];
    for (let delta = 0; delta <= last - first; delta += 3) {
      if (middle + delta <= last) samples.push(middle + delta);
      if (delta && middle - delta >= first) samples.push(middle - delta);
    }
    for (const side of [-1, 1]) {
      let placed = 0;
      for (const k of samples) {
        if (placed >= 3) break;
        const a = Math.max(0, k - 2), b = Math.min(line.n - 1, k + 2);
        const dx = line.x[b] - line.x[a], dz = line.z[b] - line.z[a];
        const length = Math.hypot(dx, dz);
        if (length < 1) continue;
        const nx = -dz / length, nz = dx / length;
        for (const offset of [28, 34, 40]) {
          const i = city.cellIndex(line.x[k] + side * nx * offset, line.z[k] + side * nz * offset);
          if (i < 0 || reserved.has(i) || patch.wallCells.has(i) || patch.cornerCells.has(i) || patch.islandCells.has(i)
            || city.kind[i] === city.KIND.OBSTACLE) continue;
          const [cx, cz] = city.cellCenter(i);
          const distanceToBox = (x, z) => Math.hypot(
            Math.max(Math.abs(x - cx) - ALLEY_CORNER_HALF, 0),
            Math.max(Math.abs(z - cz) - ALLEY_CORNER_HALF, 0));
          if (marker.some(m => distanceToBox(m.x, m.z) < m.radius + 2)) continue;
          let closest = Infinity;
          for (let j = 0; j < line.n; j++) {
            if (Math.abs(line.x[j] - cx) > 40 || Math.abs(line.z[j] - cz) > 40) continue;
            closest = Math.min(closest, distanceToBox(line.x[j], line.z[j]));
            if (closest < ALLEY_CORNER_CLEARANCE) break;
          }
          if (closest < ALLEY_CORNER_CLEARANCE || closest > 36) continue;
          saveAlleyCell(city, patch, i);
          const top = line.y[k] + ALLEY_WALL_RISE;
          city.kind[i] = city.KIND.TOWER;
          city.boxA.set([0, 0, ALLEY_CORNER_HALF, ALLEY_CORNER_HALF], i * 4);
          city.boxB.set([top, top, 0, 0], i * 4);
          city.maxHeight = Math.max(city.maxHeight, top);
          patch.cornerCells.add(i);
          patch.cornerSides[side < 0 ? 0 : 1]++;
          placed++;
          break;
        }
      }
    }
  }
}

// A small solid building occupies the inside of each connected turn. The line curves around it,
// with staggered approach offsets above, so cutting across the open intersection is no longer the
// easy way through. The same tower box is drawn and collided with by the city.
function addTurnIslands(city, course, window, candidate, patch, reserved, profile) {
  const { line } = candidate;
  for (const turn of window.turns) {
    const k = Math.round((turn.s0 + turn.s1) / (2 * course.sample));
    const a = Math.max(0, k - 2), b = Math.min(line.n - 1, k + 2);
    const dx = line.x[b] - line.x[a], dz = line.z[b] - line.z[a];
    const length = Math.hypot(dx, dz);
    if (length < 1) return false;
    const i = city.cellIndex(line.x[k] + turn.side * dz / length * 28,
      line.z[k] - turn.side * dx / length * 28);
    if (i < 0 || reserved.has(i) || patch.wallCells.has(i) || patch.cornerCells.has(i)
      || city.kind[i] === city.KIND.OBSTACLE) return false;
    const [cx, cz] = city.cellCenter(i), half = profile.islandHalf;
    let near = Infinity;
    // Only the local bend determines how close this island is to the intended lane. The final
    // whole-course blocked check below still catches any other route leg passing this cell.
    const nearFirst = Math.max(0, Math.floor((turn.s0 - 80) / course.sample));
    const nearLast = Math.min(line.n - 1, Math.ceil((turn.s1 + 80) / course.sample));
    for (let j = nearFirst; j <= nearLast; j++) {
      if (Math.abs(line.x[j] - cx) > 40 || Math.abs(line.z[j] - cz) > 40) continue;
      const px = Math.max(Math.abs(line.x[j] - cx) - half, 0);
      const pz = Math.max(Math.abs(line.z[j] - cz) - half, 0);
      near = Math.min(near, Math.hypot(px, pz));
    }
    if (near < 6 || near > 18) return false;
    const markers = [...candidate.gates, ...candidate.boosters.filter(v => v.type === 'ring')];
    const nearest = markers.reduce((best, m) => !best || Math.abs(m.s - k * course.sample) < Math.abs(best.s - k * course.sample) ? m : best, null);
    const top = Math.max(line.y[k] + 8, nearest.y + 10);
    saveAlleyCell(city, patch, i);
    city.kind[i] = city.KIND.TOWER;
    city.boxA.set([0, 0, half, half], i * 4);
    city.boxB.set([top, top, 0, 0], i * 4);
    city.maxHeight = Math.max(city.maxHeight, top);
    patch.islandCells.add(i);
  }
  return true;
}

function applyAlleyWalls(city, course, pts, window, candidate, patch, reserved, profile) {
  const { line } = candidate, { s0, s1, turns } = window, sample = course.sample;
  const shoulder = profile.shoulder ?? ALLEY_SHOULDER;
  // Ordinary towers that intrude into a bend or the turn pocket are opened. Seeded avenue
  // obstacles remain hazards; if one blocks the candidate, another window or route is tried.
  for (let k = candidate.k0; k <= candidate.k1; k++) {
    const radius = nearTurn(k * sample, turns) ? 9.5 : CLEARANCE;
    let hit = GAME.collide.sphere(city, line.x[k], line.y[k], line.z[k], radius);
    for (let cleared = 0; hit?.kind === 'tower' && cleared < 5; cleared++) {
      const i = hit.cell;
      if (city.kind[i] !== city.KIND.TOWER || reserved.has(i)) return false;
      saveAlleyCell(city, patch, i);
      city.kind[i] = city.KIND.PLAZA;
      city.boxA.fill(0, i * 4, i * 4 + 4);
      city.boxB.fill(0, i * 4, i * 4 + 4);
      hit = GAME.collide.sphere(city, line.x[k], line.y[k], line.z[k], radius);
    }
    if (hit) return false;
  }
  const height = new Map();
  const first = Math.ceil((s0 + shoulder + ALLEY_WALL_MARGIN) / sample);
  const last = Math.floor((s1 - shoulder - ALLEY_WALL_MARGIN) / sample);
  for (let k = first; k <= last; k += 2) {
    if (nearTurn(k * sample, turns)) continue;
    const alongZ = Math.abs(pts[k].dz) > Math.abs(pts[k].dx);
    const ix = Math.floor(line.x[k] / city.cell), iz = Math.floor(line.z[k] / city.cell);
    const sides = alongZ ? [[ix - 1, iz], [ix, iz]] : [[ix, iz - 1], [ix, iz]];
    for (const [cx, cz] of sides) {
      if (cx < 0 || cz < 0 || cx >= city.n || cz >= city.n) continue;
      const i = cz * city.n + cx;
      if (city.kind[i] === city.KIND.AVENUE || city.kind[i] === city.KIND.OBSTACLE) continue;
      if (reserved.has(i)) return false;
      const old = height.get(i);
      if (!old) height.set(i, { top: line.y[k] + ALLEY_WALL_RISE, alongZ });
      else if (old.alongZ === alongZ) old.top = Math.max(old.top, line.y[k] + ALLEY_WALL_RISE);
    }
  }
  for (const [i, { top, alongZ }] of height) {
    saveAlleyCell(city, patch, i);
    const a = i * 4;
    city.kind[i] = city.KIND.TOWER;
    city.boxA.set(alongZ ? [0, 0, profile.wallHalf, ALLEY_WALL_LENGTH] : [0, 0, ALLEY_WALL_LENGTH, profile.wallHalf], a);
    city.boxB.set([top, top, 0, 0], a);
    city.maxHeight = Math.max(city.maxHeight, top);
    patch.wallCells.add(i);
  }
  if (!addTurnIslands(city, course, window, candidate, patch, reserved, profile)) return false;
  if (profile.guards) addCornerGuards(city, course, window, candidate, patch, reserved);
  return true;
}

function flankedDistance(city, course, pts, window, candidate, profile) {
  const { line } = candidate, { s0, s1, turns } = window, sample = course.sample;
  const shoulder = profile.shoulder ?? ALLEY_SHOULDER;
  let distance = 0, before = 0, after = 0;
  const first = Math.ceil((s0 + shoulder + ALLEY_WALL_MARGIN) / sample);
  const last = Math.floor((s1 - shoulder - ALLEY_WALL_MARGIN) / sample);
  for (let k = first; k <= last; k++) {
    const s = k * sample;
    if (nearTurn(s, turns)) continue;
    const alongZ = Math.abs(pts[k].dz) > Math.abs(pts[k].dx);
    const x = line.x[k], y = line.y[k], z = line.z[k];
    const probe = profile.width / 2 + 2.5;
    const left = GAME.collide.sphere(city, x - (alongZ ? probe : 0), y, z - (alongZ ? 0 : probe), 1);
    const right = GAME.collide.sphere(city, x + (alongZ ? probe : 0), y, z + (alongZ ? 0 : probe), 1);
    if (left?.kind !== 'tower' || right?.kind !== 'tower') continue;
    distance += sample;
    if (turns.length && s < turns[0].s0) before += sample;
    if (turns.length && s > turns.at(-1).s1) after += sample;
  }
  return { distance, before, after };
}

function tryAlley(city, course, pts, window, side, reserved, profile) {
  const candidate = alleyCandidate(course, pts, window, side, profile);
  const patch = { saved: new Map(), wallCells: new Set(), cornerCells: new Set(), islandCells: new Set(), cornerSides: [0, 0], oldMaxHeight: city.maxHeight };
  let keep = false;
  try {
    if (!applyAlleyWalls(city, course, pts, window, candidate, patch, reserved, profile)) return null;
    const flank = flankedDistance(city, course, pts, window, candidate, profile);
    if (flank.distance < profile.minFlank || window.turns.length && (flank.before < profile.curveFlank || flank.after < profile.curveFlank
        || profile.guards && patch.cornerSides.some(n => n < 1))
      || blocked(city, candidate.line, candidate.gates)
      || candidate.boosters.some(b => b.type === 'ring' && !ringClear(city, b))) return null;
    keep = true;
    return {
      course: { ...course, line: candidate.line, gates: candidate.gates, boosters: candidate.boosters,
        start: candidate.k0 === 0 ? { ...course.start, x: candidate.line.x[0], z: candidate.line.z[0] } : course.start }, patch,
      street: { s0: window.s0, s1: window.s1,
        wallS0: window.s0 + (profile.shoulder ?? ALLEY_SHOULDER) + ALLEY_WALL_MARGIN,
        wallS1: window.s1 - (profile.shoulder ?? ALLEY_SHOULDER) - ALLEY_WALL_MARGIN,
        section: window.section, width: profile.width,
        distance: flank.distance, approach: [flank.before, flank.after],
        turnAngle: window.turns.reduce((sum, t) => sum + t.angle, 0),
        curves: window.turns.map(t => ({ s0: t.s0, s1: t.s1, angle: t.angle })),
        turns: window.turns.length, walls: patch.wallCells.size,
        cornerGuards: patch.cornerCells.size, cornerSides: [...patch.cornerSides], turnIslands: patch.islandCells.size },
    };
  } finally {
    if (!keep) undoAlleyWalls(city, patch);
  }
}

// A pad-free stretch may cross several long legs. Try each distinct minor-street run, then choose
// nonoverlapping ones by count and actual two-sided wall length. This lets a long stretch contain
// two passages on different streets instead of counting one long open turn as two passages.
function chooseAlleys(candidates, profile, requiredDistance) {
  candidates.sort((a, b) => a.window.s0 - b.window.s0 || a.window.s1 - b.window.s1);
  const next = candidates.map((c, i) => {
    let j = i + 1;
    while (j < candidates.length && candidates[j].window.s0 < c.window.s1 + profile.gap) j++;
    return j;
  });
  const memo = new Map();
  function solve(i, left, turnsNeeded) {
    if (!left) return turnsNeeded ? null : { distance: 0, items: [] };
    if (candidates.length - i < left) return null;
    const key = `${i}:${left}:${turnsNeeded}`;
    if (memo.has(key)) return memo.get(key);
    const skip = solve(i + 1, left, turnsNeeded);
    const c = candidates[i], rest = solve(next[i], left - 1, Math.max(0, turnsNeeded - Number(c.window.turns.length > 0)));
    const take = rest && { distance: c.distance + rest.distance, items: [c, ...rest.items] };
    const best = !skip || take && take.distance > skip.distance ? take : skip;
    memo.set(key, best);
    return best;
  }
  for (let count = profile.maxCount; count >= profile.minCount; count--) {
    const chosen = solve(0, count, profile.minTurns);
    if (chosen?.distance >= requiredDistance) return chosen.items;
  }
  return null;
}

// A few ring-height crossings are actual altitude obstacles. The guide line dips smoothly under
// them, then returns for the next gate. Try candidates one at a time with the real flight proof:
// only keep a dip when the whole course remains clear and flyable.
function activateBridgePipes(city, course, streets, bridges, medium) {
  const chosen = [], radius = 60, depth = 6, maxActive = medium ? 1 : 2;
  const candidates = [];
  for (const [wi, w] of streets.entries()) {
    const runs = [];
    let from = w.wallS0;
    for (const curve of w.curves || []) {
      runs.push([from, curve.s0 - 16]);
      from = curve.s1 + 16;
    }
    runs.push([from, w.wallS1]);
    for (const [ri, [lo, hi]] of runs.entries()) {
      if (hi - lo < (medium ? 190 : 150)) continue;
      const target = (lo + hi) / 2;
      const options = bridges.filter(p => p.s >= lo + radius && p.s <= hi - radius
        && course.gates.every(g => Math.abs(g.s - p.s) > radius + 5)
        && course.boosters.every(b => Math.abs(b.s - p.s) > radius + 15)
        && city.courseProps.every(prop => Math.abs(prop.s - p.s) > 30)
        && bridges.every(other => other === p || other.upper || Math.abs(other.s - p.s) > 24));
      options.sort((a, b) => Math.abs(a.s - target) - Math.abs(b.s - target));
      for (const p of options.slice(0, 3)) candidates.push({ p, run: `${wi}:${ri}` });
    }
  }
  const oldY = course.line.y, usedRuns = new Set();
  for (const { p, run } of candidates) {
    if (chosen.length >= maxActive) break;
    if (usedRuns.has(run) || chosen.some(q => Math.abs(q.s - p.s) < 120)) continue;
    const oldPipeY = p.y, before = course.line;
    const ringHeight = oldY[Math.round(p.s / course.sample)];
    // The raised crossing must still join both facades below their flat base roofs.
    if (p.cells.some(cell => city.boxes(cell)[0][4] < ringHeight + 1.75)) continue;
    city.setBridgeHeight(p, ringHeight);
    const y = Float32Array.from(oldY);
    for (const pipe of [...chosen, p]) {
      for (let j = Math.max(0, Math.floor((pipe.s - radius) / course.sample));
        j <= Math.min(y.length - 1, Math.ceil((pipe.s + radius) / course.sample)); j++) {
        const u = Math.abs(j * course.sample - pipe.s) / radius;
        if (u < 1) y[j] = Math.min(y[j], oldY[j] - depth * (1 + Math.cos(Math.PI * u)) / 2);
      }
    }
    course.line = { ...before, y };
    const clear = !blocked(city, course.line, course.gates)
      && course.boosters.every(b => b.type !== 'ring' || ringClear(city, b));
    const proof = clear && GAME.autopilot.fly(city, course);
    if (proof?.finished && !proof.crashes && !proof.missed) {
      chosen.push(p);
      usedRuns.add(run);
    } else {
      city.setBridgeHeight(p, oldPipeY);
      p.active = false;
      course.line = before;
    }
  }
  return chosen.length;
}

// One facade in a straight minor-street run projects almost to the old centreline. Bend the
// guide towards the opposite wall before it, then bring it back. A solid straight-through flight
// hits the building; the curved route and its final proof use the same boxes as the renderer.
function addInwardBuildings(city, course, pts, streets, wallCells, difficulty) {
  const sample = course.sample, line = course.line;
  const profile = difficulty === 'medium' ? { radius: 50, offset: 6, max: 1, min: 1 }
    : difficulty === 'hard' ? { radius: 58, offset: 4.5, max: 2, min: 2 }
      : { radius: 72, offset: 4.5, max: 24, min: 16 };
  const r = GAME.rng.stream(city.seed, `inward-buildings-${difficulty}-${course.attempt}`);
  const intrusions = [], used = new Set();
  const occupied = new Set(city.courseProps.map(p => p.cell));
  const markers = [...course.gates, ...course.boosters.filter(b => b.type === 'ring')];
  const halfCell = city.cell / 2;
  for (const w of streets) {
    const runs = [];
    let from = w.wallS0;
    for (const curve of w.curves || []) {
      if (curve.s0 - 20 > from) runs.push([from, curve.s0 - 20]);
      from = curve.s1 + 20;
    }
    if (w.wallS1 > from) runs.push([from, w.wallS1]);
    const candidates = [];
    for (const [lo, hi] of runs) {
      for (let k = Math.ceil((lo + profile.radius + 4) / sample);
        k <= Math.floor((hi - profile.radius - 4) / sample); k++) {
        const s = k * sample;
        if (markers.some(m => Math.abs(m.s - s) < 42)
          || course.boosters.some(b => b.type === 'pad' && Math.abs(b.s - s) < profile.radius + 36)) continue;
        const alongZ = Math.abs(pts[k].dz) > Math.abs(pts[k].dx);
        const ix = Math.floor(line.x[k] / city.cell), iz = Math.floor(line.z[k] / city.cell);
        const pair = alongZ ? [iz * city.n + ix - 1, iz * city.n + ix]
          : [(iz - 1) * city.n + ix, iz * city.n + ix];
        if (pair.some(i => !wallCells.has(i) || city.kind[i] !== city.KIND.TOWER || used.has(i))) continue;
        if (pair.every(i => occupied.has(i))) continue;
        const first = city.cellCenter(pair[0]), second = city.cellCenter(pair[1]);
        if (Math.abs((alongZ ? line.z[k] - first[1] : line.x[k] - first[0])) > sample / 2
          || Math.abs((alongZ ? line.z[k] - second[1] : line.x[k] - second[0])) > sample / 2) continue;
        candidates.push({ k, s, alongZ, pair });
      }
    }
    // Short passages use a seeded order. Fill Extreme's continuous route from front to back so
    // isolated random picks do not waste space needed for the next dodge. Sides still alternate.
    if (difficulty === 'extreme') candidates.sort((a, b) => a.s - b.s);
    else for (let j = candidates.length - 1; j > 0; j--) {
      const other = r.int(0, j);
      [candidates[j], candidates[other]] = [candidates[other], candidates[j]];
    }
    let placed = 0;
    for (const c of candidates) {
      if (placed >= profile.max) break;
      // Leave a straight gap so consecutive dodges never overlap, even on Extreme.
      const gap = profile.radius * 2 + (difficulty === 'extreme' ? 16 : 38);
      if (intrusions.some(p => Math.abs(p.s - c.s) < gap)) continue;
      const firstSide = (intrusions.length + (city.seed & 1)) % 2 ? 1 : -1;
      for (const side of [firstSide, -firstSide]) {
        if (occupied.has(c.pair[side < 0 ? 0 : 1])) continue;
        const wall = c.pair[side < 0 ? 0 : 1], opposite = c.pair[side < 0 ? 1 : 0];
        const cross = c.alongZ ? 0 : 1, half = cross + 2;
        const a = wall * 4, b = opposite * 4;
        const oldWall = city.boxA.slice(a, a + 4), oldOpposite = city.boxA.slice(b, b + 4);
        const oldWallTop = city.boxB.slice(a, a + 4);
        const wallCentre = city.cellCenter(wall)[cross] + city.boxA[a + cross];
        const lane = c.alongZ ? line.x[c.k] : line.z[c.k];
        const towardLane = -side;
        const face = wallCentre + towardLane * city.boxA[a + half];
        const reach = towardLane * (lane - towardLane * 0.8 - face);
        if (reach < 4 || reach > 15) continue;
        city.boxA[a + cross] += towardLane * reach / 2;
        city.boxA[a + half] += reach / 2;
        if (difficulty !== 'medium' && !occupied.has(opposite)) {
          const retreat = 2.2;
          city.boxA[b + cross] += towardLane * retreat / 2;
          city.boxA[b + half] -= retreat / 2;
        }
        const attached = city.bridgePipes.filter(p => p.cells.includes(wall));
        city.boxB[a] = Math.max(line.y[c.k] + 10, ...attached.map(p => p.y + 2));
        city.boxB[a + 1] = city.boxB[a];
        // Bridge segments store the facade face in their own cells. Move their endpoints with the
        // changed walls so an existing crossing stays visibly attached on both sides.
        const bridgeOffsets = [];
        for (const pipe of city.bridgePipes) for (let n = 0; n < 2; n++) {
          const cell = pipe.cells[n];
          if (cell !== wall && cell !== opposite) continue;
          const data = pipe.slots[n] ? city.bridgeB : city.bridgeA;
          const index = cell * 4 + 2, base = cell * 4;
          bridgeOffsets.push([data, index, data[index], pipe, n, pipe.boxes[n]]);
          const cellCentre = city.cellCenter(cell)[cross];
          const face = cellCentre + city.boxA[base + cross] + (n ? -1 : 1) * city.boxA[base + half];
          data[index] = face - cellCentre;
          const count = Number(Boolean(city.bridgeA[base + 3])) + Number(Boolean(city.bridgeB[base + 3]));
          const rank = pipe.slots[n] && city.bridgeA[base + 3] ? 1 : 0;
          pipe.boxes[n] = city.boxes(cell).at(-count + rank);
        }
        const centreOffset = city.boxA[a + cross], width = city.boxA[a + half];
        const oldCentreX = line.x[c.k], oldCentreZ = line.z[c.k];
        const originalHits = GAME.collide.sphere(city, oldCentreX, line.y[c.k], oldCentreZ, GAME.flight.FLIGHT.RADIUS)?.cell === wall;
        const changed = [];
        const moved = [];
        if (Math.abs(centreOffset) + width <= halfCell - 0.15 && originalHits) {
          const first = Math.max(0, Math.floor((c.s - profile.radius) / sample));
          const last = Math.min(line.n - 1, Math.ceil((c.s + profile.radius) / sample));
          for (let j = first; j <= last; j++) {
            const u = Math.abs(j * sample - c.s) / profile.radius;
            if (u >= 1) continue;
            const amount = profile.offset * (1 + Math.cos(Math.PI * u)) / 2 * -side;
            changed.push([j, line.x[j], line.z[j]]);
            if (c.alongZ) line.x[j] += amount;
            else line.z[j] += amount;
          }
          for (const m of markers) {
            if (Math.abs(m.s - c.s) >= profile.radius) continue;
            moved.push([m, m.x, m.z, m.n]);
            const k = Math.round(m.s / sample);
            const a = Math.max(0, k - 2), b = Math.min(line.n - 1, k + 2);
            const dx = line.x[b] - line.x[a], dz = line.z[b] - line.z[a], len = Math.hypot(dx, dz);
            m.x = line.x[k]; m.z = line.z[k];
            if (len) m.n = [dx / len, 0, dz / len];
          }
        }
        const clear = changed.length && changed.every(([j]) => !GAME.collide.sphere(city,
          line.x[j], line.y[j], line.z[j], CLEARANCE))
          && moved.every(([m]) => ringClear(city, m));
        const proof = clear && GAME.autopilot.fly(city, course);
        // A low approach after a beam can expose a collision or a late missed gate that a
        // normal run does not. Check the preceding beam before keeping a nearby obstruction.
        const nearbyPads = proof?.finished && !proof.crashes && !proof.missed
          ? course.boosters.filter(b => b.type === 'pad' && b.s <= c.s && c.s - b.s < 400) : [];
        const lowClear = nearbyPads.every(b => {
          const lowBy = Math.min(12, b.top - b.lift - 4);
          const low = GAME.autopilot.fly(city, course, { lowInto: [b.id], lowBy });
          return low.finished && !low.crashes && !low.missed;
        });
        if (proof?.finished && !proof.crashes && !proof.missed && lowClear) {
          intrusions.push({ s: c.s, cell: wall, opposite, side, k: c.k, originalX: oldCentreX, originalZ: oldCentreZ });
          used.add(wall); used.add(opposite);
          placed++;
          break;
        } else {
          for (const [j, x, z] of changed) { line.x[j] = x; line.z[j] = z; }
          for (const [m, x, z, n] of moved) { m.x = x; m.z = z; m.n = n; }
          for (const [data, index, old, pipe, n, box] of bridgeOffsets) {
            data[index] = old;
            pipe.boxes[n] = box;
          }
          city.boxA.set(oldWall, a);
          city.boxA.set(oldOpposite, b);
          city.boxB.set(oldWallTop, a);
        }
      }
    }
    w.inwardBuildings = placed;
  }
  return intrusions.length >= profile.min ? intrusions : null;
}

function streetNetwork(city, course, pts, difficulty) {
  const profile = STREETS[difficulty];
  const extreme = difficulty === 'extreme';
  const spans = extreme ? [] : alleyWindows(course, pts, profile), patches = [], streets = [];
  const candidates = [];
  let trial = course, accepted = false;
  try {
    if (extreme) {
      const turns = routeTurns(pts, course.sample);
      if (turns.length < profile.minTurns || !turns[0].side
        || turns.some(t => t.side !== turns[0].side)) return null;
      const window = { s0: 0, s1: course.length, turns, section: 'continuous' };
      const chosen = tryAlley(city, course, pts, window, turns[0].side, new Set(), profile);
      if (!chosen) return null;
      trial = chosen.course;
      patches.push(chosen.patch);
      streets.push(chosen.street);
    } else {
    for (let i = 0; i < spans.length; i++) for (const window of spans[i].options) {
      const sides = window.turns.length ? [window.turns[0].side] : (city.seed + i + course.attempt) % 2 ? [1, -1] : [-1, 1];
      for (const side of sides) {
        const candidate = tryAlley(city, course, pts, window, side, new Set(), profile);
        if (!candidate) continue;
        candidates.push({ window, side, distance: candidate.street.distance });
        undoAlleyWalls(city, candidate.patch);
      }
    }
    for (let choices = 0; choices < 5; choices++) {
      const selected = chooseAlleys(candidates, profile, course.length * profile.minShare);
      if (!selected) return null;
      trial = course;
      const reserved = new Set();
      let failed = null;
      for (const picked of selected) {
        const chosen = tryAlley(city, trial, pts, picked.window, picked.side, reserved, profile);
        if (!chosen) { failed = picked; break; }
        trial = chosen.course;
        patches.push(chosen.patch);
        for (const cell of chosen.patch.wallCells) reserved.add(cell);
        for (const cell of chosen.patch.cornerCells) reserved.add(cell);
        for (const cell of chosen.patch.islandCells) reserved.add(cell);
        streets.push(chosen.street);
      }
      if (!failed) break;
      for (let i = patches.length - 1; i >= 0; i--) undoAlleyWalls(city, patches[i]);
      patches.length = 0; streets.length = 0;
      candidates.splice(candidates.indexOf(failed), 1);
    }
    }
    if (streets.length < profile.minCount || streets.reduce((sum, w) => sum + w.turns, 0) < profile.minTurns
      || streets.reduce((sum, w) => sum + w.distance, 0) < trial.length * profile.minShare) return null;
    trial.obstacles = avenueObstacles(city, trial.line);
    if (trial.obstacles < DIFFICULTIES[difficulty].minObstacles) return null;
    const cells = [...new Set(patches.flatMap(p => [...p.wallCells]))];
    city.styleNarrowStreetWalls(cells, trial);
    // The decorated city is what gets flown. Failed plans undo props, obstacle hiding, and every
    // wall or cleared pocket before another route is generated.
    city.focusCourseObstacles(trial);
    if (blocked(city, trial.line, trial.gates)
      || trial.boosters.some(b => b.type === 'ring' && !ringClear(city, b))) return null;
    const props = city.placeCourseProps({ ...trial, narrowStreets: streets });
    const pipes = props.filter(p => p.type === 'pipe');
    const zigzagTurns = extreme ? streets.reduce((sum, w) => sum + (w.curves || []).filter(curve => {
      const before = pipes.filter(p => p.s >= Math.max(w.s0, curve.s0 - 110) && p.s < curve.s0);
      const after = pipes.filter(p => p.s > curve.s1 && p.s <= Math.min(w.s1, curve.s1 + 110));
      return before.some(a => after.some(b => a.laneSide === -b.laneSide));
    }).length, 0) : streets.filter(w => {
      const curve = w.curves[0];
      if (!curve) return false;
      const before = pipes.filter(p => p.s >= w.s0 && p.s < curve.s0);
      const after = pipes.filter(p => p.s > curve.s1 && p.s <= w.s1);
      return before.some(a => after.some(b => a.laneSide === -b.laneSide));
    }).length;
    if (props.length < profile.minProps || pipes.length < profile.minPipes
      || zigzagTurns < profile.minZigzags) return null;
    const baseline = GAME.autopilot.fly(city, trial, { traceHeights: true });
    if (!baseline.finished || baseline.crashes || baseline.missed) return null;
    const bridges = city.placeBridgePipes({ ...trial, narrowStreets: streets, heightTrace: baseline.heightTrace });
    if (bridges.length < profile.minBridges) return null;
    const activeBridges = activateBridgePipes(city, trial, streets, bridges, difficulty === 'medium');
    if (activeBridges < profile.minActiveBridges || blocked(city, trial.line, trial.gates)
      || trial.boosters.some(b => b.type === 'ring' && !ringClear(city, b))) return null;
    const inwardBuildings = addInwardBuildings(city, trial, pts, streets, new Set(cells), difficulty);
    if (!inwardBuildings) return null;
    trial.inwardBuildings = inwardBuildings;
    if (difficulty === 'hard' || extreme) {
      // Fill spare pipe locations after the altitude dips and building dodges are fixed. The
      // actual flown heights keep new crossings clear of those maneuvers and avoid rejecting
      // otherwise good layouts just because a required dip was crowded out by extra pipes.
      const flown = GAME.autopilot.fly(city, trial, { traceHeights: true });
      if (!flown.finished || flown.crashes || flown.missed) return null;
      city.placeBridgePipes({ ...trial, narrowStreets: streets, heightTrace: flown.heightTrace }, true);
    }
    const proof = GAME.autopilot.fly(city, trial);
    const shaky = proof.finished && !proof.crashes && !proof.missed
      ? GAME.autopilot.fly(city, trial, { noise: 0.35, seed: city.seed }) : null;
    if (!shaky?.finished) return null;
    if (extreme) {
      // Tight corners must also let a player recover after a missed lift or a crash. Check the
      // final decorated city, including the ring-height bridge dips and the real respawn rules.

    angles: [Math.PI / 2], straight: [250, 360], spacing: 110, dirt: 16, dirtSpacing: 85, cableLow: 0,
    hazards: { pipe: 8 } },
  medium: { main: 26, side: 21, gate: 7.8, pipe: 1.8, gap: 12, connectors: [6, 8], shafts: 2, turn: [112, 128],
    angles: [Math.PI / 2, Math.PI / 3], straight: [220, 330], spacing: 80, dirt: 24, dirtSpacing: 65, cableLow: 0,
    hazards: { falls: 1, cable: 3, pipe: 13 } },
  hard: { main: 23, side: 18.5, gate: 6.4, pipe: 2.1, gap: 10, connectors: [8, 10], shafts: 3, turn: [106, 122],
    angles: [Math.PI / 2, Math.PI / 3, Math.PI / 4], straight: [190, 300], spacing: 64, dirt: 32, dirtSpacing: 52,
    cableLow: 0.3, hazards: { grate: 2, sluice: 2, falls: 2, cable: 5, pipe: 18 } },
  extreme: { main: 21, side: 17, gate: 5.2, pipe: 2.4, gap: 8.5, connectors: [10, 12], shafts: 4, turn: [104, 118],
    angles: [Math.PI / 2, Math.PI / 3, Math.PI / 4], straight: [170, 270], spacing: 54, dirt: 40, dirtSpacing: 44,
    cableLow: 0.45, hazards: { grate: 4, sluice: 3, falls: 3, cable: 6, pipe: 22 } },
};
const PIPE_HITS = { grate: 'grate', sluice: 'sluice', cable: 'cable', root: 'cable', falls: 'falls' };

function segmentPoint(point, a, b) {
  const ba = b.map((v, i) => v - a[i]), pa = point.map((v, i) => v - a[i]);
  const t = clamp(dot(pa, ba) / (dot(ba, ba) || 1), 0, 1);
  return a.map((v, i) => v + ba[i] * t);
}
function distanceToSegment(point, a, b) {
  const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2];
  const px = point[0] - a[0], py = point[1] - a[1], pz = point[2] - a[2];
  const t = clamp((px * bx + py * by + pz * bz) / (bx * bx + by * by + bz * bz || 1), 0, 1);
  return Math.hypot(px - bx * t, py - by * t, pz - bz * t);
}

function sphere(city, x, y, z, radius) {
  const p = [x, y, z], world = city.sewer;
  let inShell = false, safe = false;
  for (const tube of world.tunnels) {
    const distance = distanceToSegment(p, tube.a, tube.b);
    if (distance + radius <= tube.radius) {
      inShell = true;
      if (tube.water === null || y - radius > tube.water) { safe = true; break; }
    }
  }
  if (!safe) return { kind: inShell ? 'ground' : 'tower', sewer: inShell ? 'water' : 'wall' };

    if (distanceToSegment(p, pipe.a, pipe.b) <= pipe.radius + radius) return { kind: 'tower', sewer: PIPE_HITS[pipe.kind] || 'pipe', pipe: i };
  }
  for (const [i, pile] of world.dirt.entries()) {
    if (Math.abs(x - pile.centre[0]) > pile.radii[0] + radius
      || Math.abs(y - pile.centre[1]) > pile.radii[1] + radius
      || Math.abs(z - pile.centre[2]) > pile.radii[2] + radius) continue;
    const bounds = pile.centre.map((v, j) => v - pile.radii[j])
      .concat(pile.centre.map((v, j) => v + pile.radii[j]));
    if (GAME.collide.ellipsoidDistance2(bounds, x, y, z) <= radius * radius) return { kind: 'tower', sewer: 'dirt', dirt: i };

}

// A height query takes the player's level because one network can run above another. The lower
// edge of the containing dry volume is its water, with a dirt bank or pipe on top when present.
function groundHeight(city, x, z, y = city.sewer.startY) {
  const p = [x, y, z];
  // Where overlapping volumes join (a chamber above a collector), the lowest dry edge is the floor.
  let floor = Infinity;
  for (const tube of city.sewer.tunnels) {
    const distance = distanceToSegment(p, tube.a, tube.b);
    if (distance <= tube.radius && (tube.water === null || y > tube.water)) {
      floor = Math.min(floor, tube.water ?? Math.min(tube.a[1], tube.b[1]) - tube.radius);
    }
  }
  if (!Number.isFinite(floor)) floor = city.sewer.minY;
  for (const pile of city.sewer.dirt) {
    const q = ((x - pile.centre[0]) / pile.radii[0]) ** 2 + ((z - pile.centre[2]) / pile.radii[2]) ** 2;
    if (q <= 1) {
      const top = pile.centre[1] + pile.radii[1] * Math.sqrt(1 - q);
      if (top <= y + GAME.flight.FLIGHT.RADIUS) floor = Math.max(floor, top);
    }
  }
  return floor;
}

function current(city, x, y, z) {
  let lift = GAME.flight.FLIGHT.SINK;
  for (const shaft of city.sewer.shafts) {
    const radial = Math.hypot(x - shaft.a[0], z - shaft.a[2]);
    if (radial < shaft.radius - 8 && y > shaft.a[1] - 12 && y < shaft.b[1] + 12) {
      const blend = clamp((y - shaft.a[1] + 12) / 16, 0, 1) * clamp((shaft.b[1] + 12 - y) / 16, 0, 1);
      lift += shaft.lift * blend;
    }
  }
  return lift;
}

function step(run, stick, dt) {
  if (run.crashed || run.finished) return [];
  const events = [], g = run.glider, from = [g.x, g.y, g.z];
  if (!run.lastSafePosition) {

    run.lastSafePosition = valid ? [...from] : [run.course.start.x, run.course.start.y, run.course.start.z];
  }
  const power = Math.min(22.5, run.powerLift / dt);
  run.powerLift -= power * dt;
  // The tunnel's moving air supports a level glide; the riser's ventilation lifts the player.
  GAME.flight.step(g, stick, dt, () => current(run.city, g.x, g.y, g.z)
    + GAME.flight.FLIGHT.TURN_SINK * Math.abs(stick.x) + power);
  run.time += dt;
  const to = [g.x, g.y, g.z], hit = sphere(run.city, g.x, g.y, g.z, GAME.flight.FLIGHT.RADIUS);
  if (hit) {

    // cross the wall itself in one step; freezing there would show the void outside the bore.
    [g.x, g.y, g.z] = run.lastSafePosition;
    events.push({ type: 'crash', hit }); return events;
  }
  run.lastSafePosition = [g.x, g.y, g.z];

    const crossed = GAME.collapse.crossing(from, to, gate);
    if (crossed) {
      const through = crossed.distance <= gate.radius;
      if (!through && crossed.distance <= run.course.maxRadius * 2) {
        run.missed++; run.penalty += GAME.run.PENALTY.missed;
        events.push({ type: 'missed', gate: run.next });
      }
      if (through || (!gate.finish && crossed.distance <= run.course.maxRadius * 2)) {
        if (through) events.push({ type: 'gate', gate: run.next });
        run.checkpoint = run.next++; run.retries = 0;
        if (gate.finish) { run.finished = true; events.push({ type: 'finish' }); }

  run.boundary.distance = 0; run.boundary.intensity = 0; run.boundary.travel = 0;
  return events;
}

function linePose(course, s) {
  const k = clamp(Math.round(s / course.sample), 0, course.line.n - 2), L = course.line;
  return { x: L.x[k], y: L.y[k], z: L.z[k], yaw: Math.atan2(L.x[k + 1] - L.x[k], L.z[k + 1] - L.z[k]) };
}

function respawnPose(run) {
  return { ...run.course.start };
}

function respawn(run) {
  // A lost underground attempt starts a completely new race, with no checkpoint return.
  Object.assign(run, GAME.run.create(run.city, run.course));
  run.lastSafePosition = [run.glider.x, run.glider.y, run.glider.z];
}

function steer(pilot, glider, course) {
  const L = course.line;

    const d = (L.x[k] - glider.x) ** 2 + (L.y[k] - glider.y) ** 2 + (L.z[k] - glider.z) ** 2;
    if (d < bestD) { best = k; bestD = d; }
  }
  pilot.k = best;
  const ahead = distance => Math.min(L.n - 1, best + Math.round(distance / course.sample));
  const target = ahead(12 + glider.speed * 0.18);
  const x = clamp(-wrap(Math.atan2(L.x[target] - glider.x, L.z[target] - glider.z) - glider.yaw) * 3, -1, 1);
  const a = ahead(glider.speed * 0.20), b = Math.min(L.n - 1, a + 3);
  const slope = (L.y[b] - L.y[a]) / Math.max(1, (b - a) * course.sample);
  const vy = slope * glider.speed + 1.7 * (L.y[ahead(glider.speed * 0.07)] - glider.y);
  const wind = course.currentAt(glider.x, glider.y, glider.z);

  const F = GAME.flight.FLIGHT;

  const eased = authority * authority * (3 - 2 * authority);
  return { x, y: clamp(gamma / (gamma >= 0 ? F.CLIMB_ANGLE * Math.max(0.1, eased) : F.DIVE_ANGLE), -1, 1) };

function prove(city, course, mistakes = null) {
  const run = GAME.run.create(city, course), pilot = { k: 0 }, events = [], path = [];
  const crashes = [...(mistakes?.crashAt || [])], random = GAME.rng.stream(city.seed, 'sewer-shaky');
  let wobble = { x: 0, y: 0 }, tick = 0, elapsed = 0, failures = 0;
  while (!run.finished && elapsed < course.par * 3 + 30) {
    const stick = steer(pilot, run.glider, course);
    if (mistakes?.noise) {
      if (tick % 30 === 0) wobble = { x: (random() * 2 - 1) * mistakes.noise, y: (random() * 2 - 1) * mistakes.noise };
      stick.x = clamp(stick.x + wobble.x, -1, 1); stick.y = clamp(stick.y + wobble.y, -1, 1);
    }

      crashes.shift(); const p = run.glider;
      p.y = groundHeight(city, p.x, p.z, p.y) - 2;
    }

    elapsed += DT;
    if (tick++ % 8 === 0 && !run.crashed) path.push({ x: run.glider.x, y: run.glider.y, z: run.glider.z });
    if (run.crashed) {
      failures++;
      if (!mistakes || failures > 8) break;
      respawn(run);
      pilot.k = 0;
    }
  }
  return { finished: run.finished, time: run.time, total: GAME.run.total(run), crashes: failures,
    missed: run.missed, gate: run.next, boosts: 0, events, path };
}

function restore(city, course) {
  course.energyAt = s => course.line.y[clamp(Math.round(s / SAMPLE), 0, course.line.n - 1)];
  course.currentAt = (x, y, z) => current(city, x, y, z);
  return { city, course };
}
function pack(city, course) {
  return { city, course: Object.fromEntries(Object.entries(course).filter(([, v]) => typeof v !== 'function')) };
}
const unpack = data => restore(data.city, data.course);

function build(seed, difficulty, attempt) {

    for (let k = 0; k < points.length - 1; k += chunk) {

      const end = Math.min(points.length - 1, k + 7);
      tunnels.push({ a: transform(points[k]), b: transform(points[end]), radius: width, kind, water: a[1] - width * 0.65 });

  for (let k = shaftKinds.length - 1; k > 0; k--) { const j = r.int(0, k); [shaftKinds[k], shaftKinds[j]] = [shaftKinds[j], shaftKinds[k]]; }

      const dy = (height + r.range(0, 6)) * (rising ? 1 : -1), radius = r.range(76, 96), hand = r.chance(0.5) ? 1 : -1;

  float chord = min((t1 - t0) / (2.0 * R), 1.5);              // share of a full crossing
  float outside = smoothstep(0.5, 1.4, length(o) / R);
  vec3 col = (uBoost * (0.07 + 0.55 * exp(-imp * imp * 14.0)) + mix(uBoost, vec3(1.0), 0.5) * exp(-imp * imp * 90.0) * 0.8) * chord * fade * outside;
  // Rings on the surface where the ray enters and leaves: both halves show, rising at 40 u/s.
  for (int i = 0; i < 2; i++) {
    float ts = i == 0 ? tIn : tOut;
    if (ts <= 0.0 || ts >= tMax) continue;
    float ys = ro.y + rd.y * ts;
    float d = (fract((ys - uTime * 40.0) / 32.0 + pad.w) - 0.5) * 32.0;
    float pix = ts * pixAngle / max(sqrt(1.0 - imp * imp), 0.2);
    float back = i == 1 && tIn > 0.0 ? 0.5 : 1.0;                // the far wall, seen through the column
    col += uBoost * tube(d, 0.4, pix) * 2.2 * smoothstep(H * 0.75, 8.0, ys) * smoothstep(-1.0, 2.0, ys) * back;
  }
  if (outside < 1.0 && tOut < tMax) {
    vec3 w = ro + rd * tOut;
    float lane = atan(w.z - centre.y, w.x - centre.x) / TAU * 40.0;
    float streak = pulseAA(lane, 0.05, tOut * pixAngle * 40.0 / (TAU * R))
                 * pow(fract((w.y - uTime * 140.0) / 14.0 + hash11(floor(lane) + pad.w * 64.0)), 4.0);
    col += uBoost * streak * 2.5 * (1.0 - outside) * smoothstep(H * 0.75, 8.0, w.y) * smoothstep(-1.0, 2.0, w.y);
  }
  return col;
}

// A booster's pad on the street: a lit disc under its column with a bright edge (the column's
// rings carry the motion). local: position from the cell centre.
vec3 padLight(vec2 local, vec4 pad, float pix) {
  float r = length(local);
  return uBoost * (tube(r - pad.y, 0.4, pix) * 3.5 + smoothstep(pad.y, 0.0, r) * 0.25);
}

// A course ring hit by the ray: a neon tube of light with a style per kind. The next gate is hot
// pink and alive, later gates are quiet, dashed and turning, the finish is gold and checkered,
// boost rings are lime (uBoost) with chevrons climbing inside, and a pale flare races ahead of a
// gate just flown through. f: flare, x-ray. Behind a tower (t >= tMax) an x-ray ring shows only its thin
// core, dimmed: where the goal is, without pretending it is in plain view.
vec3 ringLight(vec3 ro, vec3 rd, vec4 c, vec4 n, vec2 f, float tMax, float pixAngle) {
  float den = dot(rd, n.xyz);
  if (abs(den) < 1e-4) return vec3(0.0);
  float t = dot(c.xyz - ro, n.xyz) / den;
  bool hidden = t >= tMax;
  if (t <= 0.0 || (hidden && f.y <= 0.0)) return vec3(0.0);
  vec3 q = ro + rd * t - c.xyz;
  float R = c.w, r = length(q), d = r - R;
  float px = t * pixAngle;
  if (d > 0.5 * R + 12.0 + 9.0 * px) return vec3(0.0);        // beyond every style's outermost glow
  float kind = n.w;
  if (hidden) return (kind == RING_FINISH ? FINISH : GATE_NEXT) * tube(d, max(0.3, px * 0.7), px * 1.2) * 0.6 * f.y;
  if (kind == RING_SECRET) {
    float near = 1.0 - smoothstep(20.0, 100.0, t);
    float breathe = 0.88 + 0.12 * sin(uTime * uSecretMotionScale * 1.8);
    return vec3(0.65, 0.008, 0.014) * tube(d, 0.13 + near * 0.06, max(0.025, px))
         * (0.35 + near * 0.65) * breathe * (1.0 - smoothstep(90.0, 125.0, t));
  }
  vec3 reference = abs(n.y) > 0.9 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
  vec3 side = normalize(cross(n.xyz, reference));
  vec2 lq = vec2(dot(q, side), dot(q, cross(side, n.xyz)));   // also supports a horizontal shaft ring
  float turn = atan(lq.y, lq.x) / TAU;                          // -0.5..0.5 around the ring
  float inside = smoothstep(R, R - 2.0, r);
  vec3 col;
  if (kind == RING_NEXT) {
    // A comet of light races around the tube and a ping rings outward: fly here. Its tube keeps
    // about two pixels of full brightness however far away it is.
    float core = tube(d, max(0.55, px * 1.1), px * 1.2);
    float comet = pow(fract(turn - uTime * 0.8), 6.0);
    float ping = fract(uTime * 1.2);
    col = GATE_NEXT * (core * (2.2 + 3.5 * comet) + tube(d, 2.6, px * 3.0) * 0.3 + inside * 0.05
                       + tube(r - R * (1.0 + 0.5 * ping), 0.35, px) * (1.0 - ping) * (1.0 - ping) * 1.4)
        + HOT * core * core * core * 1.2;
    col *= 1.0 + 3.0 * f.x;
  } else if (kind == RING_LATER) {
    // Dashed and slowly turning: a shape no tower outline has, even where a colour matches.
    float dashes = pulseAA(turn * 16.0 + uTime * 0.25, 0.6, px * 16.0 / (TAU * R));
    col = LATER_CORE * tube(d, max(0.4, px * 0.8), px * 1.2) * dashes * 1.8 + GATE_LATER * tube(d, 2.2, px * 3.0) * 0.18;
  } else if (kind == RING_FINISH) {
    // Chequered lights crawl around a double gold ring (averaged once they are pixel-sized).
    float check = mix(step(0.5, fract(turn * 16.0 + uTime * 0.3)), 0.5, smoothstep(1.5, 4.0, px));
    float core = tube(d, max(0.7, px * 1.1), px * 1.2);
    col = FINISH * (core * (1.6 + 2.6 * check) + tube(r - R - 1.8, 0.3, px) * 1.8 + tube(d, 3.5, px * 3.0) * 0.3 + inside * 0.06)
        + vec3(1.0, 0.95, 0.85) * core * core * core * check * 1.5;
    return col;   // no distance fade: the finish should be visible from anywhere
  } else if (kind == RING_BOOST) {
    float lines = tube(d, 0.3, px) + tube(r - R + 1.2, 0.2, px) * 0.8;
    float chevPix = px / 2.8;
    float chev = bandAA(fract((lq.y + abs(lq.x) * 0.75) / 2.8 - uTime * 1.8) - 0.5, 0.14, chevPix) * mix(1.0, 0.3, smoothstep(0.2, 0.6, chevPix));
    col = uBoost * (lines * 2.4 + tube(d, 2.0, px * 3.0) * 0.15 + (chev * 0.6 + 0.05) * smoothstep(R - 1.2, R - 2.4, r));
  } else {
    // Flare: a thin pale ring racing ahead along the course. It sweeps in from the edges of the
    // view and shrinks towards the next gate: a rush, not a veil over the city.
    col = (HOT * tube(d, 0.25, px * 1.4) * 2.4 + GATE_NEXT * tube(d, 1.2, px * 3.0) * 0.15) * f.x * f.x;
  }
  return col * exp(-t * 0.0009);
}

// The finish gate's beacon: a gold shaft standing up out of the ring with pulses of light climbing
// it, seen over the rooftops from anywhere on the course. Its core keeps about a pixel and a half
// of full brightness at any distance.
vec3 beaconLight(vec3 ro, vec3 rd, vec4 c, float tMax, float pixAngle) {
  vec2 o = ro.xz - c.xz;
  float t = -dot(o, rd.xz) / max(dot(rd.xz, rd.xz), 1e-6);   // closest approach to the axis
  if (t <= 0.0 || t >= tMax) return vec3(0.0);
  float y = ro.y + rd.y * t - c.y - c.w - 1.0;
  if (y <= 0.0) return vec3(0.0);
  float b = length(o + rd.xz * t), px = t * pixAngle;
  float pulse = pow(fract((y - uTime * 120.0) / 90.0), 5.0);
  float core = tube(b, max(0.8, px * 0.9), px * 1.2);
  return (FINISH * (core * (1.1 + 2.4 * pulse) + tube(b, 4.0, px * 3.0) * 0.12) + HOT * core * pulse * 1.5)
       * smoothstep(0.0, 8.0, y) * exp(-y / 600.0);
}

// The guide line: a white-hot thread in a pink halo through the next gates, with dashes flowing
// forward along the course. It fades in a little ahead of the glider so it never smears across the
// view, and keeps about a pixel and a half of full brightness at any distance. Behind towers, its
// stretch up to the next gate (x-ray) shows as a dim dotted line, so a turn behind a corner stays
// readable. Chunks of segments the ray passes far from are skipped whole: most pixels touch none.
const float GUIDE_NEAR = 8.0;
float guideHalo(float px) { return max(0.6, px * 2.0); }
vec3 guideLight(vec3 ro, vec3 rd, float tMax, float pixAngle) {
  float core = 0.0, halo = 0.0, ghost = 0.0;
  for (int c = 0; c < PATH_CHUNKS; c++) {
    vec4 S = uPathB[c];
    if (S.w <= 0.0) break;
    // The glow widens with distance: the sphere's far side bounds it.
    vec3 w = S.xyz - ro;
    float tc = dot(w, rd), reach = S.w + 3.0 * guideHalo((length(w) + S.w) * pixAngle);
    if (tc < -reach || dot(w, w) - tc * tc > reach * reach) continue;
    for (int j = 0; j < PATH_CHUNK; j++) {
      int i = c * PATH_CHUNK + j;
      if (i >= PATH_POINTS - 1) break;
      vec4 A = uPath[i], B = uPath[i + 1];
      if (B.w <= 0.0) break;
      vec3 ba = B.xyz - A.xyz, w0 = ro - A.xyz;
      float b = dot(rd, ba), cc = dot(ba, ba), d = dot(rd, w0), e = dot(ba, w0);
      float den = cc - b * b;
      float u = den > 1e-5 ? clamp((e - b * d) / den, 0.0, 1.0) : 0.0;
      vec3 q = A.xyz + ba * u;
      float t = dot(q - ro, rd);
      vec2 m = mix(uPathM[i], uPathM[i + 1], u);                 // distance along the course, x-ray
      bool hidden = t >= tMax;
      if (t < GUIDE_NEAR || (hidden && m.y <= 0.0)) continue;
      float px = t * pixAngle, dist = length(ro + rd * t - q), hw = guideHalo(px);
      if (dist > 3.0 * hw) continue;                            // beyond the glow: skip the shading
      float fade = mix(A.w, B.w, u) * smoothstep(GUIDE_NEAR, 40.0, t);
      float thread = tube(dist, max(0.12, px * 0.9), px * 1.2);
      // Max, not sum: neighbouring segments meet at their shared points and would double up there.
      if (hidden) { ghost = max(ghost, thread * pulseAA(m.x / 4.0, 0.4, px / 4.0) * m.y * fade); continue; }
      float dash = mix(pow(fract(m.x / 18.0 - uTime * 5.5), 4.0), 0.2, smoothstep(160.0, 260.0, t));
      float k = (0.3 + 1.6 * dash) * fade;
      core = max(core, thread * k);
      halo = max(halo, tube(dist, hw, px * 2.5) * k);
    }
  }
  return HOT * core * 2.2 + GUIDE * (halo * 0.35 + ghost * 0.6);
}

// Course light over the scene. Added light alone vanishes against a bright sky or fog, so it also
// covers what is behind it by its own brightness: a core covers most of the scene, a faint halo a
// little of it, which cuts each light out of a bright haze. Over the dark night city this changes
// almost nothing.
vec3 overScene(vec3 scene, vec3 light) {
  return scene * (1.0 - 0.8 * saturate(3.0 * max(light.r, max(light.g, light.b)))) + light;
}

float secretPlate(vec2 p, vec2 halfs, float px) {
  return bandAA(p.x, halfs.x, px) * bandAA(p.y, halfs.y, px);
}

float secretSegment(vec2 p, vec2 a, vec2 b) {
  vec2 edge = b - a;
  return length(p - a - edge * clamp(dot(p - a, edge) / dot(edge, edge), 0.0, 1.0));
}

// White warning triangle and exclamation mark, painted over the red banner rather than
// depending on text or the theme's neon palette. Its shape stays readable at reduced resolution.
vec3 secretBanner(vec2 p, vec2 size, float px, float phase, float time) {
  float body = secretPlate(p, size, px), box = max(abs(p.x) - size.x, abs(p.y) - size.y);
  float cloth = 0.88 + 0.09 * sin(p.x * 1.1 + phase + time * 0.18);
  vec3 col = vec3(0.76, 0.009, 0.018) * body * cloth;
  col += vec3(1.5, 0.02, 0.03) * tube(box, 0.11, px) * 0.65;
  float scale = max(0.35, min(size.x * 0.77, size.y * 0.83));
  vec2 q = p / scale;
  vec2 a = vec2(0.0, 0.86), b = vec2(-0.83, -0.66), c = vec2(0.83, -0.66);
  float edge = min(secretSegment(q, a, b), min(secretSegment(q, b, c), secretSegment(q, c, a))) * scale;
  float triangle = tube(edge, max(0.065 * scale, px * 0.7), px);
  float stem = secretPlate(p - vec2(0.0, 0.08 * scale), vec2(max(0.085 * scale, px * 0.55), 0.30 * scale), px);
  float dotRadius = max(0.105 * scale, px * 0.45);
  float markDot = 1.0 - smoothstep(dotRadius - px * 0.5, dotRadius + px * 0.5,
    length(p - vec2(0.0, -0.42 * scale)));
  float warning = max(triangle, max(stem, markDot));
  col = mix(col, vec3(2.6), warning * body);
  return col;
}

// Rooms on a real wall form a broken red grid. Small horizontal tears and a slow scanning band
// give it a corrupted-display look; brightness changes smoothly and never strobes the facade.
vec3 secretWindows(vec2 p, vec2 size, float px, float phase, float time) {
  float body = secretPlate(p, size, px);
  vec2 period = vec2(2.65, 3.25), grid = p / period;
  float row = floor(grid.y + 0.5), rowSeed = hash11(row + phase * 13.1);
  grid.x += (rowSeed - 0.5) * 0.22 + sin(time * 0.45 + rowSeed * TAU) * 0.035;
  vec2 room = (fract(grid + 0.5) - 0.5) * period;
  float pane = secretPlate(room, vec2(0.86, 1.02), px);
  float tear = pulseAA(grid.y * 4.0 + phase, 0.80, px * 4.0 / period.y);
  float scan = bandAA(mod(p.y - time * 1.55 + phase * 5.0 + 4.5, 9.0) - 4.5, 0.17, px);
  float rooms = 0.70 + 0.19 * sin(time * 0.65 + hash12(floor(grid + 0.5)) * TAU + phase);
  float frame = max(tube(abs(room.x) - 0.92, 0.055, px) * bandAA(room.y, 1.1, px),
    tube(abs(room.y) - 1.09, 0.055, px) * bandAA(room.x, 0.96, px));
  vec3 col = vec3(1.9, 0.012, 0.023) * pane * rooms * (0.79 + 0.21 * tear + 0.16 * scan);
  col += vec3(1.3, 0.015, 0.026) * frame * 0.36;
  return col * body;
}

// These panels are attached just outside real facades and respect the city's first hit.
// Only a purchased-key secret ring can supply their metadata, so the cluster is absent normally.
vec3 secretWarningsLight(vec3 ro, vec3 rd, float tMax, float pixAngle) {
  vec3 windows = vec3(0.0), banners = vec3(0.0);
  float bannerCover = 0.0;
  float time = uTime * uSecretMotionScale;
  for (int i = 0; i < MAX_WARNINGS; i++) {
    if (float(i) >= uSecretWarningCount) break;
    vec4 centre = uSecretWarningC[i], meta = uSecretWarningN[i];
    vec3 normal = vec3(meta.x, 0.0, meta.y);
    float range = distance(ro, centre.xyz), den = dot(rd, normal);
    if (range >= ${WARNING_RANGE}.0 || den >= -${WARNING_FACING}) continue;
    float t = dot(centre.xyz - ro, normal) / den;
    if (t <= 0.0 || t >= tMax) continue;
    vec3 q = ro + rd * t - centre.xyz;
    vec3 side = vec3(-normal.z, 0.0, normal.x);
    vec2 p = vec2(dot(q, side), q.y), size = vec2(abs(centre.w), meta.z);
    float px = max(0.025, t * pixAngle / max(abs(den), 0.2));
    if (abs(p.x) > size.x + px * 3.0 || abs(p.y) > size.y + px * 3.0) continue;
    // Keep the promised cue readable all the way to the same 180-unit cutoff used by its proof.
    float fade = 0.72 + 0.28 * (1.0 - smoothstep(110.0, ${WARNING_RANGE}.0, range));
    if (centre.w < 0.0) {
      banners = max(banners, secretBanner(p, size, px, meta.w, time) * fade);
      bannerCover = max(bannerCover, secretPlate(p, size, px));
    } else windows = max(windows, secretWindows(p, size, px, meta.w, time) * fade);
  }
  // A banner covers a window grid on the same wall; its warning stays white instead of
  // acquiring extra red emission where the two painted rectangles overlap.
  return windows * (1.0 - bannerCover) + banners;
}

// Signed distance to a five-point star, with crisp anti-aliased edges at any render scale.
float starDistance(vec2 p, float radius) {
  float nearest = 1e6;
  bool inside = false;
  vec2 a = vec2(0.0, radius);
  for (int j = 1; j <= 10; j++) {
    float angle = float(j) * TAU / 10.0;
    vec2 b = vec2(sin(angle), cos(angle)) * radius * (j % 2 == 0 ? 1.0 : 0.46);
    vec2 edge = b - a;
    nearest = min(nearest, length(p - a - edge * clamp(dot(p - a, edge) / dot(edge, edge), 0.0, 1.0)));
    if ((a.y > p.y) != (b.y > p.y)) {
      if (p.x < a.x + (b.x - a.x) * (p.y - a.y) / (b.y - a.y)) inside = !inside;
    }
    a = b;
  }
  return inside ? -nearest : nearest;
}

// A slowly turning coin-like star with a gentle bob, a breathing halo and orbiting glints.
// All light respects the city's depth, so stars are discovered in pockets rather than through walls.
vec3 collectibleLight(vec3 ro, vec3 rd, vec4 c, float phase, float saved, float tMax, float pixAngle) {
  if (c.w <= 0.0) return vec3(0.0);
  vec3 centre = c.xyz + vec3(0.0, sin(uTime * 2.0 + phase) * 0.55, 0.0);
  vec3 delta = centre - ro;
  float tc = dot(delta, rd);
  if (tc <= 0.0 || tc >= tMax || tc > 550.0) return vec3(0.0);
  float d = length(delta - rd * tc), px = max(0.02, tc * pixAngle);
  if (d > c.w * 3.0 + px * 3.0) return vec3(0.0);
  float pulse = 0.75 + 0.25 * sin(uTime * 3.0 + phase);
  vec3 col = saved > 0.5 ? vec3(0.0) : uCollectibleColour * exp(-d * d / (c.w * c.w * 1.7)) * 0.28 * pulse;
  float angle = uTime * 1.1 + phase;
  vec3 side = vec3(cos(angle), 0.0, -sin(angle));
  vec3 normal = vec3(sin(angle), 0.0, cos(angle));
  float den = dot(rd, normal);
  if (abs(den) > 0.035) {
    float t = dot(centre - ro, normal) / den;
    if (t > 0.0 && t < tMax) {
      vec3 q = ro + rd * t - centre;
      vec2 p = vec2(dot(q, side), q.y);
      float distance = starDistance(p, c.w);
      float aa = max(px, px / max(abs(den), 0.2));
      float face = 1.0 - smoothstep(-aa, aa, distance);
      float facet = 0.8 + 0.3 * sin(atan(p.y, p.x + 0.0001) * 5.0 + angle);
      float shine = pow(max(0.0, sin(angle + 0.6)), 12.0);
      if (saved > 0.5) {
        // Almost transparent: just enough face and edge to recognize a star already found.
        // overScene covers less than 14% of the background at this brightness.
        col += mix(uCollectibleColour, vec3(1.0), 0.35) * (face * 0.015 + tube(distance, 0.14, aa) * 0.04);
      } else {
        col += uCollectibleColour * face * facet * (1.5 + shine)
          + mix(uCollectibleColour, vec3(1.0), 0.8) * tube(distance, 0.14, aa) * 1.8;
      }
    }
  }
  vec3 up = vec3(0.0, 1.0, 0.0);
  vec3 right = normalize(cross(normalize(delta), up) + vec3(0.0001, 0.0, 0.0));
  if (saved < 0.5) for (int j = 0; j < 3; j++) {
    float a = -uTime * 0.85 + phase + float(j) * TAU / 3.0;
    vec3 spark = centre + (right * cos(a) + up * sin(a)) * c.w * 1.65;
    vec3 q = spark - ro;
    float t = dot(q, rd);
    if (t <= 0.0 || t >= tMax) continue;
    float r = length(q - rd * t);
    col += mix(uCollectibleColour, vec3(1.0), 0.65) * tube(r, 0.16, px) * (1.2 + pulse);
  }
  return col * (1.0 - smoothstep(300.0, 550.0, tc));
}

// The rings, stars, finish beacon and guide line along a ray whose city hit is at tMax. (Booster
// columns are traced with the city's cells, which they stand in, and pads shaded with the street.)
vec3 courseLight(vec3 ro, vec3 rd, float tMax, float pixAngle) {
  vec3 col = vec3(0.0);
  for (int i = 0; i < MAX_RINGS; i++) {
    if (uRingN[i].w <= 0.0) continue;
    col += ringLight(ro, rd, uRingC[i], uRingN[i], uRingF[i], tMax, pixAngle);
    if (uRingN[i].w == RING_FINISH) col += beaconLight(ro, rd, uRingC[i], tMax, pixAngle);
  }
  for (int i = 0; i < 3; i++) col += collectibleLight(ro, rd, uCollectibles[i], uCollectiblePhases[i], uCollectibleSaved[i], tMax, pixAngle);
  return col + guideLight(ro, rd, tMax, pixAngle) + secretWarningsLight(ro, rd, tMax, pixAngle);
}
`;

// Bounding sphere (centre, radius) of each chunk of guide segments: its points and the first
// point of the next chunk, where its last segment ends.
function chunkBounds(guide) {
  const out = new Float32Array(PATH_POINTS / PATH_CHUNK * 4);
  for (let c = 0; c * PATH_CHUNK < guide.length - 1; c++) {
    const pts = guide.slice(c * PATH_CHUNK, (c + 1) * PATH_CHUNK + 1);
    const lo = [0, 1, 2].map(a => Math.min(...pts.map(p => p[a])));
    const hi = [0, 1, 2].map(a => Math.max(...pts.map(p => p[a])));
    const centre = lo.map((v, a) => (v + hi[a]) / 2);
    const radius = Math.max(...pts.map(p => Math.hypot(p[0] - centre[0], p[1] - centre[1], p[2] - centre[2])));
    out.set([...centre, radius + 0.01], c * 4);
  }
  return out;
}

// The uniforms for one frame's view of the course: rings [{ x, y, z, n, radius, kind, flare, xray }]
// (kind: next, later, finish, boost or flare; xray: shown through towers) and guide line points
// [[x, y, z, brightness, s, xray]] (s: distance along the course).
function uniforms(rings, guide, stars = []) {
  if (rings.length > MAX_RINGS) throw new Error(`${rings.length} rings, the shader draws ${MAX_RINGS}`);
  if (guide.length > PATH_POINTS) throw new Error(`${guide.length} guide points, the shader draws ${PATH_POINTS}`);
  const ringC = new Float32Array(MAX_RINGS * 4), ringN = new Float32Array(MAX_RINGS * 4), ringF = new Float32Array(MAX_RINGS * 2);
  const path = new Float32Array(PATH_POINTS * 4), pathM = new Float32Array(PATH_POINTS * 2);
  const collectibles = new Float32Array(12), phases = new Float32Array(4), saved = new Float32Array(4);
