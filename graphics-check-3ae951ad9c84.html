  if (t <= 0.0 || t >= tMax || t > 440.0) return vec3(0.0);
  vec3 p = ro + rd * t - centre;
  float w = 3.3 + max(t * pixAngle, 0.02), height = 6.0;
  float flame = exp(-dot(p.xz, p.xz) / (w * w) - p.y * p.y / (height * height));
  float flicker = 0.6 + 0.4 * sin(uAmbientTime * 8.0 + centre.x + centre.z);
  float tongues = 0.6 + 0.4 * tnoise(vec3(p.xz * 0.5, p.y * 0.6 - uAmbientTime * 3.0));
  return mix(vec3(1.7, 0.12, 0.018), vec3(2.4, 0.75, 0.08), tongues) * flame * flicker
    * smoothstep(0.0, 1.8, uCollapseTime) * (1.0 - smoothstep(320.0, 440.0, t));
}

Hit traceMoving(vec3 ro, vec3 rd, float limit, float pixAngle, inout vec3 glow) {
  Hit hit; hit.kind = SKY; hit.t = min(limit, FAR); hit.moving = 0; hit.primitive = citySpecialId(0);
  for (int group = 0; group < uCollapseMoverCount; group++) {
    vec4 bound = uCollapseMoverBounds[group];
    vec3 delta = bound.xyz - ro;
    float along = dot(delta, rd);
    if (dot(delta, delta) - along * along > bound.w * bound.w || along + bound.w < 0.0 || along - bound.w > hit.t) continue;
    vec4 pivot = texelFetch(uCollapseMotion, ivec2(group, 0), 0);
    vec4 turn = texelFetch(uCollapseMotion, ivec2(group, 1), 0);
    vec4 object = texelFetch(uCollapseMotion, ivec2(group, 2), 0);
    vec3 localRo = collapseRotate(ro - pivot.xyz + vec3(0.0, pivot.w, 0.0), turn, true) + pivot.xyz;
    vec3 localRd = collapseRotate(rd, turn, true);
    vec3 inv = 1.0 / mix(localRd, vec3(1e-6), lessThan(abs(localRd), vec3(1e-6)));
    for (int part = 0; part < int(object.w); part++) {
      ivec2 at = ivec2(group * 16 + part, 0);
      vec4 lo = texelFetch(uCollapseSolids, at, 0), hi = texelFetch(uCollapseSolids, at + ivec2(0, 1), 0);
      vec3 normal;
      float t = lo.w > 1.5 ? capsuleHit(localRo, localRd, lo.xyz, hi.xyz, lo.w, normal)
        : lo.w > 0.5 ? ellipsoidHit(localRo, localRd, lo.xyz, hi.xyz, normal)
          : boxHit(localRo, inv, lo.xyz, hi.xyz, normal);
      if (t >= hit.t) continue;
      hit.kind = int(hi.w); hit.t = t; hit.n = collapseRotate(normal, turn, false); hit.primitive = cityMovingId(group, part, hit.kind);
      hit.cell = ivec2(int(object.x) % int(uN), int(object.x) / int(uN)); hit.moving = group + 1;
      hit.a = texelFetch(uCollapseSolids, at + ivec2(0, 2), 0);
      hit.b = texelFetch(uCollapseSolids, at + ivec2(0, 3), 0);
    }
  }
  return hit;
}

void traceMovingFire(Hit near, vec3 ro, vec3 rd, float pixAngle, inout vec3 glow) {
  // Moving flames are resolved after the nearest static/moving surface is known, so they
  // cling to the rotated crown without shining through a nearer intact building.
  for (int group = 0; group < uCollapseMoverCount; group++) {
    vec4 object = texelFetch(uCollapseMotion, ivec2(group, 2), 0);
    if (object.y < 0.5) continue;
    vec3 crown = texelFetch(uCollapseMotion, ivec2(group, 3), 0).xyz;
    glow += collapseFire(ro, rd, crown, crown.y, near.t, pixAngle);
  }
}

// The wrapper supplies the same clamped direction to both traversal and the final flames.
Hit traceNearest(vec3 ro, vec3 rd, int maxCells, float pixAngle, inout vec3 glow) {
  Hit h; h.kind = SKY; h.t = FAR; h.moving = 0; h.primitive = citySpecialId(0);
  vec3 inv = 1.0 / rd;
  float tGround = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  if (uCollapsePortalActive > 0.5 && tGround <= 0.0) tGround = 1e9;
  bool shaft = false;
  vec3 shaftNormal = vec3(0.0, 1.0, 0.0);
  if (uCollapsePortalActive > 0.5 && tGround > 0.0 && portalVoid(ro + rd * tGround)) tGround = 1e9;
  if (uCollapsePortalActive < 0.5 && uCollapseActive > 0.5 && ((tGround > 0.0 && length((ro + rd * tGround).xz - uCollapseHole.xy) < uCollapseHole.z)
    || (ro.y < 0.0 && length(ro.xz - uCollapseHole.xy) < uCollapseHole.z))) {
    shaft = true; tGround = sewerHit(ro, rd, shaftNormal);
  }
  Hit moved = traceMoving(ro, rd, tGround, pixAngle, glow);
  if (uCollapsePortalActive > 0.5) {
    vec3 normal;int material;int primitive;float t=portalHit(ro,rd,normal,material,primitive);
    if(t>0.0&&t<moved.t) {
      moved.kind=PORTAL;moved.t=t;moved.n=normal;moved.moving=0;moved.a=vec4(float(material),0.0,0.0,0.0); moved.primitive = int(uN)*int(uN)*32+1536+primitive;
      moved.cell=ivec2(floor((ro.xz+rd.xz*t)/uCell));
    }
  }
  vec3 nIgnore;
  float lowest=uCollapsePortalActive>0.5?uCollapsePortalOrigin.y+uCollapsePortalAxis.y*uCollapsePortalAxis.w-uCollapsePortalOrigin.w
    :uCollapseActive>0.5?uCollapseHole.w:-1.0;
  vec2 span = slab(ro, inv, vec3(0.0,lowest,0.0), vec3(uSize, uMaxH, uSize), nIgnore);
  if (span.x <= span.y && span.y > 0.0) {
    float t = max(span.x, 0.0);
    vec3 p = ro + rd * (t + 1e-3);
    ivec2 cell = clamp(ivec2(floor(p.xz / uCell)), ivec2(0), ivec2(int(uN) - 1));
    vec2 stepv = sign(rd.xz);
    vec2 tDelta = abs(uCell * inv.xz);
    vec2 tMax = ((vec2(cell) + max(stepv, 0.0)) * uCell - ro.xz) * inv.xz;
    for (int i = 0; i < maxCells; i++) {
      float tExit = min(tMax.x, tMax.y);
      vec4 A = texelFetch(uBoxA, cell, 0);
      vec4 moveMap = uCollapseMoverCount > 0 ? texelFetch(uCollapseMotionMap, cell, 0) : vec4(0.0);
      if (moveMap.x > 0.5) A = vec4(0.0);
      float fall = collapseFall(cell);
      float tStreet = 1e9;
      vec3 nStreet;
      vec4 streetA, streetB; int streetPart = 0;
      // High rays skip all street data; lower rays fetch bounds only in occupied cells.
      float lowY = min(ro.y + rd.y * t, ro.y + rd.y * min(tExit, span.y));
      if (lowY < uStreetMaxH && t < 640.0) {
        vec4 info = texelFetch(uStreetInfo, cell, 0);
        if (lowY < info.y) for (int part = 0; part < int(info.x); part++) {
          if (movingStreetPart(moveMap, part)) continue;
          ivec2 at = cell + ivec2(0, part * 2 * int(uN));
          vec4 P = texelFetch(uStreet, at, 0), Q = texelFetch(uStreet, at + ivec2(0, int(uN)), 0);
          vec3 lo = vec3(P.x, Q.x, P.y), hi = vec3(P.z, Q.y, P.w), normal;
          if (Q.w > 1.5) {
            vec2 bounds = slab(ro, inv, lo, hi, normal);
            if (bounds.x > bounds.y || bounds.y < 0.0 || bounds.x > tStreet) continue;
          }
          float tp = Q.w > 1.5 ? capsuleHit(ro, rd, lo, hi, Q.w, normal)
            : Q.w > 0.5 ? ellipsoidHit(ro, rd, lo, hi, normal) : boxHit(ro, inv, lo, hi, normal);
          if (tp < tStreet) { tStreet = tp; nStreet = normal; streetA = P; streetB = Q; streetPart = part; }
        }
      }
      if (uCollapseActive > 0.5 && t < 440.0 && max(moveMap.y, max(moveMap.z, moveMap.w)) < 0.5) {
        vec4 info = texelFetch(uStreetInfo, cell, 0);
        glow += collapseFire(ro, rd, vec3((vec2(cell) + 0.5).x * uCell, 0.0, (vec2(cell) + 0.5).y * uCell),
          info.w, min(tExit, min(tGround, tStreet)), pixAngle);
      }
      float tBridge = 1e9;
      vec3 nBridge;
      vec4 bridgeData; int bridgePart = 0;
      for (int j = 0; j < uBridgePieceLimit; j++) {
        vec4 C = j == 0 ? texelFetch(uBridgeA, cell, 0) : texelFetch(uBridgeB, cell, 0);
        if (moveMap.x > 0.5) continue;
        C.y -= fall;
        if (abs(C.w) < 0.5) continue;
        vec2 cc = (vec2(cell) + 0.5) * uCell;
        bool alongZ = abs(C.w) < 1.5;
        float face = (alongZ ? cc.x : cc.y) + C.z;
        float end = (alongZ ? cc.x : cc.y) + sign(C.w) * uCell * 0.5;
        float along = (alongZ ? cc.y : cc.x) + C.x;
        vec3 lo = alongZ ? vec3(min(face, end), C.y - 0.75, along - 0.7)
          : vec3(along - 0.7, C.y - 0.75, min(face, end));
        vec3 hi = alongZ ? vec3(max(face, end), C.y + 0.75, along + 0.7)
          : vec3(along + 0.7, C.y + 0.75, max(face, end));
        vec3 nPipe;
        float tp = boxHit(ro, inv, lo, hi, nPipe);
        if (tp < tBridge) { tBridge = tp; nBridge = nPipe; bridgeData = C; bridgePart = j; }
      }
      if (A.z > A.x) {
        vec4 B = texelFetch(uBoxB, cell, 0);
        bool hasProp = B.w > 0.5;
        vec4 towerA, towerB; int towerPart = 0;
        vec3 towerN;
        float tb = 1e9;
        // Up to three pieces, already assembled from the collision geometry at upload time.
        // Only composite buildings fetch extra bounds; no per-ray architecture/rotation work.
        for (int part = 0; part < int(B.z); part++) {
          vec4 P = A, Q = B;
          if (part > 0) {
            ivec2 at = cell + ivec2(0, (part - 1) * 2 * int(uN));
            P = texelFetch(uStructure, at, 0);
            Q = texelFetch(uStructure, at + ivec2(0, int(uN)), 0);
          }
          Q.xy -= vec2(fall);
          vec3 nPiece;
          float tPiece = boxHit(ro, inv, vec3(P.x, Q.x, P.y), vec3(P.z, Q.y, P.w), nPiece);
          if (tPiece < tb) {
            tb = tPiece; towerN = nPiece;
            towerA = vec4((P.xy + P.zw) * 0.5 - (vec2(cell) + 0.5) * uCell, (P.zw - P.xy) * 0.5);
            towerB = Q; towerPart = part;
          }
        }
        if (hasProp) {
          vec4 P = texelFetch(uPropA, cell, 0), Q = texelFetch(uPropB, cell, 0);
          Q.xy -= vec2(fall);
          vec2 pc = (vec2(cell) + 0.5) * uCell + P.xy;
          vec3 np;
          float tp = 1e9; int propPart = 0;
          if (Q.z > 2.5) {
            bool alongZ = P.w > P.z;
            float alongHalf = alongZ ? P.w : P.z;
            float depthHalf = alongZ ? P.z : P.w;
            float py = 0.5 * (Q.x + Q.y);
            float spread = (Q.y - Q.x) * 0.24;
            float railHalf = (Q.y - Q.x) * 0.1;
            float supportHalf = (Q.y - Q.x) * 0.38;
            float outer = (alongZ ? pc.x : pc.y) - Q.w * (depthHalf - 0.17);
            for (int j = 0; j < uPropPieceLimit; j++) {
              vec3 lo, hi;
              if (j < 2) {
                float cy = py + (j == 0 ? -spread : spread);
                lo = alongZ ? vec3(outer - 0.17, cy - railHalf, pc.y - alongHalf)
                  : vec3(pc.x - alongHalf, cy - railHalf, outer - 0.17);
                hi = alongZ ? vec3(outer + 0.17, cy + railHalf, pc.y + alongHalf)
                  : vec3(pc.x + alongHalf, cy + railHalf, outer + 0.17);
              } else {
                float offset = (j == 2 ? -1.0 : 1.0) * (alongHalf - 0.85);
                lo = alongZ ? vec3(pc.x - depthHalf, py - supportHalf, pc.y + offset - 0.22)
                  : vec3(pc.x + offset - 0.22, py - supportHalf, pc.y - depthHalf);
                hi = alongZ ? vec3(pc.x + depthHalf, py + supportHalf, pc.y + offset + 0.22)
                  : vec3(pc.x + offset + 0.22, py + supportHalf, pc.y + depthHalf);
              }
              vec3 nPiece;
              float tPiece = boxHit(ro, inv, lo, hi, nPiece);
              if (tPiece < tp) { tp = tPiece; np = nPiece; propPart = j; }
            }
          } else {
            tp = boxHit(ro, inv, vec3(pc.x - P.z, Q.x, pc.y - P.w),
              vec3(pc.x + P.z, Q.y, pc.y + P.w), np);
          }
          if (tp < tb && tp < tBridge && tp < tStreet && tp < tGround && tp < 1e8) {
            h.kind = PROP; h.t = tp; h.n = np; h.cell = cell; h.a = P; h.b = Q; h.primitive = cityStaticId(cell,3+propPart);
            return closerHit(h, moved);
          }
        }
        if (tb < tBridge && tb < tStreet && tb < tGround && tb < 1e8) {
          h.kind = TOWER; h.t = tb; h.n = towerN; h.cell = cell; h.a = towerA; h.b = towerB; h.primitive = cityStaticId(cell,towerPart);
          return closerHit(h, moved);
        }
      } else {
        // Empty cell: a booster's light column stands wholly inside it, so only the ground can hide it.
        vec4 pad = texelFetch(uPads, cell, 0);
        if (pad.x > 0.0) glow += beamLight(ro, rd, (vec2(cell) + 0.5) * uCell, pad, tGround, pixAngle);
      }
      if (tStreet < tBridge && tStreet < tGround && tStreet < 1e8) {
        h.kind = STREET; h.t = tStreet; h.n = nStreet; h.cell = cell; h.a = streetA; h.b = streetB; h.primitive = cityStaticId(cell,9+streetPart);
        return closerHit(h, moved);
      }
      if (tBridge < tGround && tBridge < 1e8) {
        h.kind = BRIDGE; h.t = tBridge; h.n = nBridge; h.cell = cell; h.a = bridgeData; h.primitive = cityStaticId(cell,7+bridgePart);
        return closerHit(h, moved);
      }
      if (moved.kind != SKY && moved.t <= tExit) return closerHit(h, moved);
      if (tGround <= tExit) break;
      if (tExit > span.y || tExit > FAR) break;
      t = tExit;
      if (tMax.x < tMax.y) { tMax.x += tDelta.x; cell.x += int(stepv.x); }
      else { tMax.y += tDelta.y; cell.y += int(stepv.y); }
      if (any(lessThan(cell, ivec2(0))) || any(greaterThanEqual(cell, ivec2(int(uN))))) break;
    }
  }
  if (tGround >= 0.0 && tGround < FAR) { h.kind = shaft ? SEWER : GROUND; h.t = tGround; h.n = shaft ? shaftNormal : vec3(0.0, 1.0, 0.0); h.cell = ivec2(floor((ro.xz + rd.xz * tGround) / uCell)); h.primitive = cityStaticId(h.cell,shaft?26:25); }
  return closerHit(h, moved);
}

Hit trace(vec3 ro, vec3 rd, int maxCells, float pixAngle, inout vec3 glow) {
  rd = mix(rd, vec3(1e-6), lessThan(abs(rd), vec3(1e-6)));
  Hit near = traceNearest(ro, rd, maxCells, pixAngle, glow);
  // Keep this after traversal so early returns do not duplicate the moving-fire call graph.
  traceMovingFire(near, ro, rd, pixAngle, glow);
  return near;
}

// ---- Atmosphere --------------------------------------------------------------------------------
// Sky gradient: haze low down (city light, or dawn), deep sky above, and a band of glow right
// over the horizon.
vec3 skyGlow(vec3 rd) {
  float y = max(rd.y, 0.0);
  return mix(uSkyHorizon, uSkyZenith, pow(y, 0.45)) + uSkyGlow * exp(-y * 14.0);
}

// The theme's sun low over the horizon, over the sky col: a wide halo and an opaque disc; with
// stripes, the retro synthwave sun whose lower half is cut into bands that widen downwards and
// drift down, showing the sky through them. Its edge is a pixel soft, or blurred by haze.
vec3 withSun(vec3 col, vec3 rd, float pixAngle) {
  float c = dot(rd, uSunDir);
  if (uSunSize <= 0.0 || c <= 0.0) return col;
  float ang = sqrt(2.0 * (1.0 - c));
  col += uSunHalo * (exp(-ang / (uSunSize * 1.2)) * 0.6 + exp(-ang * 2.0) * 0.3);
  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), uSunDir));
  vec2 q = vec2(dot(rd, right), dot(rd, cross(uSunDir, right))) / uSunSize;   // disc radius 1
  float px = pixAngle / uSunSize;
  float edge = max(px, uSunSoft);
  float disc = smoothstep(1.0 + edge, 1.0 - edge, length(q));
  if (uSunStripes > 0.0) {
    float gap = saturate(0.2 - 0.5 * q.y);
    disc *= 1.0 - pulseAA((q.y - uTime * 0.03) / 0.16, gap, px / 0.16) * uSunStripes;
  }
  return mix(col, mix(uSunBottom, uSunTop, smoothstep(-0.6, 0.7, q.y)), disc);
}

vec3 sky(vec3 rd, float pixAngle) {
  vec2 sp = rd.xz / max(rd.y + 0.25, 0.08);
  float star = step(0.9975, hash12(floor(sp * 220.0))) * smoothstep(0.15, 0.5, rd.y);
  vec3 col = skyGlow(rd) + star * 0.6 * uStars;
  if (uClouds > 0.0 && rd.y > 0.015) {
    // Two broad cloud scales give the horizon depth without a volumetric ray march. Warm
    // edges face the sun; storm themes keep a darker, almost continuous ceiling.
    vec2 q = rd.xz / (rd.y + 0.18);
    q += vec2(uAmbientTime * 0.002, uAmbientTime * 0.001);
    float broad = tnoise(vec3(q * vec2(0.7, 1.1), 17.0));
    float wisps = tnoise(vec3(q * vec2(2.6, 3.1) + broad * 1.5, 19.0));
    float cloud = smoothstep(0.39, 0.7, broad * 0.72 + wisps * 0.28);
    float rim = smoothstep(0.4, 0.58, broad) * (1.0 - smoothstep(0.58, 0.8, broad));
    float sunward = pow(max(dot(rd, uSunDir), 0.0), 6.0);
    vec3 colour = uFogHigh * (0.65 + wisps * 0.55) + uSunHalo * sunward * (0.25 + rim * 0.65);
    col = mix(col, colour, cloud * uClouds * smoothstep(0.015, 0.14, rd.y));
  }
  if (uAurora > 0.0 && rd.y > 0.0) {
    float az = atan(rd.z, rd.x);
    for (int layer = 0; layer < 3; layer++) {
      float l = float(layer), phase = az * 2.0 + l * 1.7;
      float bend = sin(phase + uAmbientTime * 0.035) * 0.065 + sin(az * 5.0 - l - uAmbientTime * 0.02) * 0.025;
      float height = rd.y - 0.2 - l * 0.1 - bend;
      float curtain = exp(-abs(height) * (height < 0.0 ? 80.0 : 15.0));
      float folds = 0.45 + 0.55 * pow(0.5 + 0.5 * sin(az * 32.0 + sin(az * 11.0 + l) * 2.0 + uAmbientTime * 0.07), 2.0);
      vec3 colour = mix(vec3(0.035, 0.35, 0.19), vec3(0.23, 0.055, 0.33), smoothstep(0.0, 0.16, height));
      col += colour * curtain * folds * (0.75 - l * 0.18) * smoothstep(0.03, 0.14, rd.y) * uAurora;
    }
  }
  return withSun(col, rd, pixAngle);
}

// Height fog, integrated analytically along the ray (denser near the ground), lit by the sun
// where the ray looks towards it.
vec3 applyFog(vec3 col, vec3 ro, vec3 rd, float t) {
  const float a = 0.004, b = 0.012;
  float k = rd.y * b;
  float fog = clamp(a * uFogDensity * exp(-ro.y * b) * (abs(k) > 1e-5 ? (1.0 - exp(-t * k)) / k : t), 0.0, 1.0);
  vec3 fogCol = mix(uFogLow, uFogHigh, smoothstep(-0.1, 0.4, rd.y)) + uSunHalo * pow(max(dot(rd, uSunDir), 0.0), 12.0) * 0.5;
  return mix(col, fogCol, fog);
}

// Rain: streaks on two cylinders around the camera whose axis is the air's motion past it
// (uRainAxis: up and a little into the wind when hovering, tilting towards the heading in flight),
// hidden behind anything the view ray hit nearer. Flying moves the camera along that axis, which
// scrolls the streaks along it: they stream from the heading and rush past. Each cylinder has a
// whole number of columns around, so there is no seam, and a streak in some of the cells of each
// column; the rows repeat after RAIN_ROWS, so the travel can wrap there without a jump.
const float RAIN_LAYER[2] = float[2](7.0, 18.0);   // cylinder radii (a third, further out, cost 3% and hardly showed)
const float RAIN_ROW = ${RAIN_ROW}.0, RAIN_ROWS = ${RAIN_ROWS}.0;
vec3 rainLight(vec3 rd, float tHit, float pixAngle) {
  vec3 q = vec3(dot(rd, uRainX), dot(rd, uRainAxis), dot(rd, uRainZ));
  float off = max(length(q.xz), 0.05);                        // sine of the ray's angle to the axis
  float turn = atan(q.z, q.x) / TAU, slope = q.y / off;
  float sum = 0.0;
  for (int i = 0; i < 2; i++) {
    float d = RAIN_LAYER[i], t = d / off;
    if (t >= tHit) break;
    float columns = floor(TAU * d / 0.8);
    vec2 cell = vec2(turn * columns, (slope * d + uRainTravel) / RAIN_ROW);
    float column = mod(floor(cell.x), columns);
    float row = cell.y + hash11(column * 1.37 + float(i) * 11.0);   // columns fall out of step
    float r = hash12(vec2(column + float(i) * 131.0, mod(floor(row), RAIN_ROWS)));
    if (r > 0.6) continue;
    r /= 0.6;
    float across = (fract(cell.x) - 0.2 - 0.6 * r) * TAU * d / columns;
    float along = fract(row) / (0.25 + 0.3 * fract(r * 7.3));    // 0..1 over the streak's length
    sum += tube(across, 0.012, t * pixAngle) * smoothstep(0.0, 0.2, along) * smoothstep(1.0, 0.5, along);
  }
  return vec3(0.55, 0.65, 0.8) * sum * 0.35 * uRain;
}

// Snow uses the rain's depth-aware flight motion, with separate, rounded flakes instead of
// streaks. Three layers vary their sizes and drift so the snowfall has depth without hiding rings.
vec3 snowLight(vec3 rd, float tHit, float pixAngle) {
  const float layers[3] = float[3](6.0, 14.0, 30.0);
  const float rowHeight = 6.0, rows = RAIN_ROW * RAIN_ROWS / rowHeight;
  vec3 q = vec3(dot(rd, uRainX), dot(rd, uRainAxis), dot(rd, uRainZ));
  float off = max(length(q.xz), 0.05), turn = atan(q.z, q.x) / TAU, slope = q.y / off;
  float sum = 0.0;
  for (int i = 0; i < 3; i++) {
    float d = layers[i], t = d / off;
    if (t >= tHit || t > 140.0) break;
    float columns = floor(TAU * d / 1.6);
    vec2 cell = vec2(turn * columns, (slope * d + uRainTravel) / rowHeight);
    float column = mod(floor(cell.x), columns);
    float row = cell.y + hash11(column * 1.37 + float(i) * 11.0);
    vec3 h = hash33(vec3(column + float(i) * 131.0, mod(floor(row), rows), 19.3));
    if (h.z > uSnowfall) continue;
    float across = (fract(cell.x) - 0.2 - h.x * 0.6) * TAU * d / columns;
    across += sin(uAmbientTime * 0.8 + h.z * TAU) * 0.12;
    float along = (fract(row) - 0.2 - h.y * 0.6) * rowHeight;
    float flake = tube(length(vec2(across, along)), mix(0.045, 0.095, h.z), t * pixAngle);
    sum += flake * (1.0 - smoothstep(90.0, 140.0, t));
  }
  return vec3(0.55, 0.65, 0.8) * sum * 0.6;
}

// A raindrop's ripple on the wet street: each 1.4-unit cell gets a drop at its own place and time,
// whose ring runs outward and tilts the mirror (it shows where the street reflects light).
// Returns the tilt in x/z; faded out where a ring would be smaller than a pixel.
vec2 rainRipple(vec2 p, float pix) {
  if (pix >= 1.0 / 6.0) return vec2(0.0);
  vec2 cell = floor(p / 1.4);
  vec3 h = hash33(vec3(cell, 3.1));
  vec2 o = p - (cell + 0.25 + 0.5 * h.xy) * 1.4;
  float age = fract(uTime * 1.1 + h.z), r = length(o);
  float x = (r - age * 0.5) / 0.05;                          // across the ring
  return o / max(r, 1e-3) * (-x * exp(-x * x)) * (1.0 - age) * 0.35 * saturate(1.0 - pix * 6.0);
}

// Flush roof panels, recessed maintenance hatches and drainage channels. These are surface
// details on the shared solid roof, so a visible fitting never creates an invisible obstacle.
vec3 shadeRoof(vec2 halfs, vec2 c, vec3 p, vec3 tint, float fp) {
  vec2 local = p.xz - c, e = halfs - abs(local);
  float edge = min(e.x, e.y);
  float wear = mix(0.5, tnoise(vec3(p.xz * 0.24, 2.0)), 1.0 - smoothstep(1.0, 4.0, fp));
  vec3 col = uRoof * (0.75 + 0.5 * wear) + vec3(0.006, 0.009, 0.012);
  float seams = max(1.0 - pulseAA(local.x / 3.4, 0.98, fp / 3.4),
    1.0 - pulseAA(local.y / 4.1, 0.98, fp / 4.1));
  col *= 1.0 - seams * 0.65;
  col *= 1.0 - bandAA(edge - 1.1, 0.17, fp) * 0.6;
  float detail = 1.0 - smoothstep(0.35, 1.2, fp);
  if (detail > 0.0) {
    vec2 panelHalf = min(halfs * vec2(0.48, 0.3), vec2(3.0, 2.0));
    vec2 panel = local - halfs * vec2(0.12, -0.18);
    float cover = plateAA(panel, panelHalf, vec2(fp));
    float inset = plateAA(panel, panelHalf - 0.16, vec2(fp));
    float grille = pulseAA(panel.y / 0.28, 0.38, fp / 0.28);
    vec3 metal = mix(uRoof * 0.5 + vec3(0.028, 0.038, 0.045),
      vec3(0.009, 0.014, 0.018) + vec3(0.03, 0.045, 0.05) * grille, inset);
    vec2 bolts = abs(panel) - (panelHalf - 0.1);
    metal += vec3(0.12, 0.14, 0.16) * discAA(bolts, 0.07, fp);
    col = mix(col, metal, cover * detail);
  }
  col += tint * (neonLine(edge - 0.45, 0.14, fp) * 2.2 + 0.03 * exp(-edge / 1.5));
  col = themeRoof(col, local, halfs, p, fp);
  return col;
}

// Windows on a facade (u across it from its left edge, v up), per-tower pitch, floor height and
// style (grid, ribbon glazing or vertical fins). Occupancy comes in clusters of floors and bays,
// so facades read as dark glass with pockets of life; averaged out once smaller than a pixel.
vec3 windows(float u, float v, vec2 fp, float floorH, float key, vec3 style, vec3 tint, out float glass) {
  float pitch = mix(1.1, 2.1, style.x);
  float kind = fract(style.z * 7.13);
  vec2 duty = kind < 0.5 ? vec2(0.62, 0.5) : kind < 0.8 ? vec2(0.96, 0.42) : vec2(0.4, 0.9);
  vec2 wc = vec2(u / pitch, v / floorH), wf = fp / vec2(pitch, floorH);
  float busy = 0.15 + 0.65 * fract(style.y * 7.77 + style.z * 3.3);  // some towers near dark, some alive
  vec3 mean = uWindowMean * busy;                                     // the expected value of the rooms below
  // Windows smaller than a pixel both ways (the skyline, most reflections): only their mean shows,
  // and a filtered pulse a pixel wide or more is exactly its duty.
  if (min(wf.x, wf.y) >= 1.0) { glass = duty.x * duty.y; return mean; }
  glass = pulseAA(wc.x, duty.x, wf.x) * pulseAA(wc.y - 0.3, duty.y, wf.y);
  vec2 wid = floor(wc);
  float occupied = step(hash13(vec3(floor(wid.y / 3.0), floor(wid.x / 5.0), key)), busy);
  float rnd = hash13(vec3(wid, key));
  vec3 col = rnd < 0.03 ? tint : mix(uWindow[0], uWindow[1], step(0.45, fract(rnd * 7.3)));
  // Rooms stay dim enough that their warm and cool colours survive tone mapping.
  vec3 lit = col * occupied * step(rnd, 0.36) * (0.25 + 0.9 * fract(rnd * 13.1));
  // Up close a lit window shows its room: brighter under the ceiling light, a mullion splitting
  // the pane and blinds part way down in some rooms. The mean replaces it all once windows are tiny.
  vec2 pane = vec2(fract(wc.x) / duty.x, fract(wc.y - 0.3) / duty.y);
  float closeUp = saturate(1.0 - 2.0 * max(wf.x, wf.y));
  float blind = step(0.55, fract(rnd * 5.7)) * smoothstep(-0.03, 0.03, pane.y - 0.35 - 0.5 * fract(rnd * 3.3));
  lit *= mix(1.0, (0.45 + 1.1 * smoothstep(0.2, 0.9, pane.y)) * (1.0 - 0.75 * blind), closeUp);
  lit *= 1.0 - bandAA(pane.x - 0.5, 0.025, wf.x / duty.x) * closeUp;
  return mix(lit, mean, smoothstep(0.35, 1.0, max(wf.x, wf.y)));
}

// Tower facade: dark glass with lit windows, neon bands on some towers, corner strips on others,
// a rim under the roofline, and a blinking red beacon on the giants. pix is the pixel footprint
// in world units at the hit.
vec3 shadeTower(Hit h, vec3 p, vec3 rd, float pix, bool reflection) {
  vec2 c = (vec2(h.cell) + 0.5) * uCell + h.a.xy;
  float seed = hash12(vec2(h.cell) * 0.731 + 3.7);
  vec3 style = hash31(seed * 97.0);
  vec2 halfs = h.a.zw;
  float top = h.b.y;
  vec3 tint = neon(style.x);
  float cosv = max(abs(dot(h.n, rd)), 0.08);

  if (h.n.y > 0.5) return shadeRoof(halfs, c, p, tint, pix / cosv);
  if (h.n.y < -0.5) {
    // Exposed ceilings get ribbed metal and a continuous edge light: the underside of a
    // cantilever reads clearly when approaching from below, including in dark themes.
    vec2 q = p.xz - c;
    float fp = pix / cosv;
    float edge = neonLine(min(halfs.x - abs(q.x), halfs.y - abs(q.y)) - 0.3, 0.13, fp);
    float ribs = pulseAA((q.x + q.y) / 2.4, 0.09, fp / 1.7);
    return uRoof * (0.34 + ribs * 0.3) + vec3(0.012, 0.022, 0.03) + tint * (0.055 + edge * 3.0);
  }

  // Facade coordinates and the pixel footprint along each (the ray cone's ellipse on the wall).
  bool xFace = abs(h.n.x) > 0.5;
  float halfU = xFace ? halfs.y : halfs.x;
  float u = (xFace ? p.z - c.y : p.x - c.x) + halfU;          // 0..2*halfU across the face
  vec3 tang = xFace ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);
  vec3 proj = rd - h.n * dot(rd, h.n);
  proj /= max(length(proj), 1e-4);
  float stretch = 1.0 / cosv - 1.0;
  vec2 fp = pix * (1.0 + stretch * vec2(abs(dot(proj, tang)), abs(proj.y)));

  // Neon from the street below washes the lower floors.
  vec3 col = uWall + mix(uNeon[0], uNeon[1], tnoise(vec3(p.xz * 0.01, 1.0))) * 0.035 * exp(-p.y / 16.0);
  vec3 style2 = hash31(seed * 131.0 + 7.0);
  float floorH = mix(2.3, 2.9, style2.y), glass;
  vec3 lit = windows(u, p.y, fp, floorH, seed * 311.0 + dot(h.n, vec3(1.0, 2.0, 3.0)), style2, tint, glass);
  // Concrete, alloy and curtain-wall bays have broad structural detail at flight speed, with
  // filtered joints and window sills. Fine weathering disappears before it can shimmer.
  float bay = mix(2.8, 5.2, style.y);
  float joints = max(1.0 - pulseAA(u / bay, 0.975, fp.x / bay),
    1.0 - pulseAA(p.y / floorH, 0.955, fp.y / floorH));
  vec3 cladding = mix(vec3(0.034, 0.041, 0.052), vec3(0.012, 0.024, 0.036), step(0.42, style2.z));
  cladding = mix(cladding, uRoof * 0.4 + vec3(0.014, 0.018, 0.023), 0.3);
  float light = 0.6 + 0.4 * max(dot(surfaceWorldVector(h, h.n), uSunSize > 0.0 ? uSunDir : vec3(-0.6, 0.7, -0.38)), 0.0);
  float detail = 1.0 - smoothstep(0.3, 1.1, max(fp.x, fp.y));
  float weather = detail > 0.0 ? mix(0.5, tnoise(vec3(u * 0.32, p.y * 0.055, seed * 19.0)), detail) : 0.5;
  col += cladding * light * (0.78 + weather * 0.44) * (1.0 - joints * 0.65) * (1.0 - glass * 0.65);
  float sill = pulseAA(p.y / floorH - 0.275, 0.025, fp.y / floorH);
  float upright = pulseAA(u / bay - 0.945, 0.018, fp.x / bay);
  col += cladding * (sill * 1.8 + upright * 1.2);
  col += glass * (vec3(0.004, 0.006, 0.014) + lit);
  // Dark glass: a faint fresnel sheen of the sky, skipped inside reflections. Each curtain-wall
  // panel sits a little off-plane, so up close the sheen breaks into the patchwork of real glass.
  if (!reflection) {
    vec2 tilt = (hash22(floor(vec2(u / 4.0, p.y / (3.0 * floorH))) + seed * 57.0) - 0.5) * 0.14 * saturate(1.0 - 2.0 * max(fp.x, fp.y));
    vec3 nt = normalize(h.n + tang * tilt.x + vec3(0.0, tilt.y, 0.0));
    col += skyGlow(surfaceWorldVector(h, reflect(rd, nt))) * (0.04 + 0.96 * pow(1.0 - max(abs(dot(nt, rd)), 0.08), 5.0)) * (0.35 + 0.65 * glass);
  }

  if (detail > 0.0) {
    // A few mechanical floors break up the glazing with recessed louvres and framed panels.
    float storey = floor(p.y / (floorH * 4.0));
    float service = step(0.76, hash11(storey + seed * 71.0));
    float panel = plateAA(vec2(u - halfU, mod(p.y, floorH * 4.0) - floorH * 0.52),
      vec2(max(halfU - 1.6, 0.5), floorH * 0.3), fp) * service * detail;
    float slats = pulseAA(p.y / 0.24, 0.3, fp.y / 0.24);
    col = mix(col, vec3(0.01, 0.017, 0.022) + cladding * (0.4 + slats * 1.5), panel);
    // Service conduits follow the wall and have regularly spaced fastening bands.
    float conduit = bandAA(u - 0.9, 0.09, fp.x) * step(0.55, style.y) * detail;
    col = mix(col, cladding * 2.4 + vec3(0.06, 0.045, 0.022) * pulseAA(p.y / 3.0, 0.07, fp.y / 3.0), conduit);
  }

  // Thin strips, so up close they stay coloured lines instead of blooming into white bars.
  float bandH = floorH * FLOOR_BANDS;
  float band = style.z < 0.45 ? neonLine(p.y - floor(p.y / bandH + 0.5) * bandH, 0.12, fp.y) : 0.0;
  float corner = style.z > 0.35 ? neonLine(min(u, 2.0 * halfU - u), 0.15, fp.x) : 0.0;
  float rim = neonLine(top - p.y - 0.9, 0.14, fp.y);
  col += tint * (band * 2.0 + corner * 3.0 + rim * 2.4);
  col = themeFacade(col, vec2(u, p.y), top, floorH, seed, fp, glass, tint);
  if (h.b.x < 0.5 && p.y < 6.5) col = storefront(col, vec2(u, p.y), halfU, seed, fp, tint);
  if (uGrowth > 0.0) col = overgrowth(col, u, p.y, top, seed, fp, surfaceWorldVector(h, h.n));

  // Giants carry a red aircraft beacon, blinking.
  if (top > 140.0) col += vec3(1.0, 0.05, 0.02) * 10.0 * bandAA(top - p.y - 2.0, 0.6, fp.y) * bandAA(u - halfU, 0.8, fp.x) * step(0.5, fract(uTime * 0.7 + seed));
  return col;
}

// Small course obstacles have their own metal silhouettes and face details, so they read as
// equipment mounted on the building instead of a tiny tower. The shaded cuboid is also the exact
// solid cuboid in city.boxes(): no decorative fins project outside the collision shape.
vec3 shadeProp(Hit h, vec3 p, vec3 rd, float pix) {
  vec2 c = (vec2(h.cell) + 0.5) * uCell + h.a.xy;
  bool xFace = abs(h.n.x) > 0.5;
  bool front = (h.a.z < h.a.w && xFace) || (h.a.w < h.a.z && abs(h.n.z) > 0.5);
  float halfU = xFace ? h.a.w : h.a.z;
  float u = (xFace ? p.z - c.y : p.x - c.x) / max(halfU, 0.01);
  float v = (p.y - 0.5 * (h.b.x + h.b.y)) / max(0.5 * (h.b.y - h.b.x), 0.01);
  float edge = min(min(1.0 - abs(u), 1.0 - abs(v)), 1.0);
  float fp = pix / max(abs(dot(h.n, rd)), 0.18);
  float halfV = 0.5 * (h.b.y - h.b.x);
  float detail = 1.0 - smoothstep(0.18, 0.65, fp);
  vec2 bolt = abs(vec2(u * halfU, v * halfV)) - vec2(halfU - 0.22, halfV - 0.22);
  float screws = discAA(bolt, 0.085, fp) * detail;
  float weather = detail > 0.0 ? mix(0.5, tnoise(p * vec3(1.3, 0.35, 1.3)), detail) : 0.5;
  if (h.b.z < 1.5) {
    // AC unit: pale alloy casing, a dark round fan, and a cyan conduit around the face.
    vec3 col = vec3(0.08, 0.13, 0.17) + vec3(0.025, 0.04, 0.05) * max(h.n.y, 0.0);
    float rim = neonLine(edge * min(halfU, 0.5 * (h.b.y - h.b.x)), 0.11, fp);
    col += vec3(0.18, 0.45, 0.5) * rim;
    if (front && abs(h.n.y) < 0.5) {
      float rad = length(vec2(u * 0.95, v));
      float fan = 1.0 - smoothstep(0.72, 0.78, rad);
      col = mix(col, vec3(0.018, 0.028, 0.035), fan);
      float blades = smoothstep(0.1, 0.45, cos(atan(v, u * 0.95 + 1e-5) * 5.0 - uTime * 7.0 - rad * 3.0));
      col += vec3(0.045, 0.075, 0.085) * blades * fan * detail;
      float grille = pulseAA((u + 1.0) * 8.0, 0.17, fp * 4.0) * fan;
      col += vec3(0.13, 0.24, 0.27) * grille;
      col += vec3(0.055, 0.08, 0.09) * pulseAA((v + 1.0) * 7.0, 0.1, fp * 3.5) * fan;
      col += vec3(0.16, 0.65, 0.75) * neonLine(rad - 0.78, 0.025, fp / max(halfU, 1.0));
      col += vec3(0.22, 0.28, 0.29) * (1.0 - smoothstep(0.12, 0.18, rad));
      float label = plateAA(vec2(u, v + 0.86), vec2(0.48, 0.07), fp / vec2(halfU, halfV));
      float stripes = pulseAA((u * halfU + v * halfV) * 2.0, 0.5, fp * 2.8);
      col = mix(col, mix(vec3(0.02), vec3(0.5, 0.3, 0.07), stripes), label * detail);
    } else {
      col += vec3(0.05, 0.11, 0.13) * pulseAA((v + 1.0) * 6.0, 0.25, fp * 2.0);
    }
    return col * (0.83 + 0.3 * weather) + vec3(0.23, 0.28, 0.3) * screws;
  }
  if (h.b.z > 2.5) {
    // Four actual solids: two exposed conduit rails and two short brackets into the facade.
    float collar = bandAA(abs(u) - 0.84, 0.1, fp / max(halfU, 1.0));
    vec3 col = vec3(0.025, 0.048, 0.055);
    col += vec3(0.07, 0.12, 0.14) * max(h.n.y, 0.0);
    col += vec3(0.045, 0.13, 0.15) * max(abs(h.n.x), abs(h.n.z));
    col += vec3(0.3, 0.09, 0.04) * collar;
    float seams = pulseAA((u * halfU) / 1.8, 0.045, fp / 1.8);
    col *= 1.0 - seams * 0.45;
    col += vec3(0.16, 0.21, 0.23) * collar * pulseAA(p.y / 0.32, 0.18, fp / 0.32) * detail;
    col += vec3(0.1, 0.34, 0.38) * neonLine(edge * 0.33, 0.045, fp);
    return col * (0.8 + 0.35 * weather);
  }
  // Cargo/textile rack: a dark rectangular cabinet with lit rails and coloured stacked rolls.
  vec3 col = vec3(0.025, 0.018, 0.045);
  float rim = neonLine(edge * min(halfU, 0.5 * (h.b.y - h.b.x)), 0.16, fp);
  col += vec3(0.85, 0.14, 0.56) * rim * 1.6;
  if (front && abs(h.n.y) < 0.5) {
    float shelves = pulseAA((v + 1.0) * 3.2, 0.13, fp * 1.2);
    float uprights = bandAA(abs(u) - 0.78, 0.045, fp / max(halfU, 1.0));
    float roll = pulseAA((u + 1.0) * 2.8 + floor((v + 1.0) * 3.2) * 0.27, 0.62, fp * 1.3);
    col += mix(vec3(0.09, 0.2, 0.4), vec3(0.46, 0.07, 0.3), step(0.5, fract(floor((v + 1.0) * 3.2) * 0.61))) * roll * (1.0 - shelves);
    col += vec3(0.42, 0.42, 0.54) * shelves + vec3(1.1, 0.22, 0.62) * uprights;
    float straps = bandAA(abs(u) - 0.44, 0.035, fp / max(halfU, 1.0));
    col = mix(col, vec3(0.13, 0.16, 0.19), straps * detail);
    float labels = plateAA(vec2(fract((u + 1.0) * 2.8) - 0.45, fract((v + 1.0) * 3.2) - 0.4),
      vec2(0.15, 0.065), vec2(fp * 1.3, fp * 1.2));
    col += vec3(0.18, 0.2, 0.2) * labels * detail;
  } else col += vec3(0.12, 0.04, 0.1) * pulseAA((v + 1.0) * 3.2, 0.13, fp * 1.2);
  return themeEquipment(col * (0.85 + 0.3 * weather) + vec3(0.27, 0.3, 0.32) * screws, p, h.n, pix);
}

vec3 shadeBridge(Hit h, vec3 p, vec3 rd, float pix) {
  bool alongX = abs(h.a.w) < 1.5;
  float across = alongX ? p.x : p.z;
  vec2 c = (vec2(h.cell) + 0.5) * uCell;
  float side = (alongX ? p.z - c.y : p.x - c.x) - h.a.x;
  float height = p.y - h.a.y;
  float fp = pix / max(abs(dot(h.n, rd)), 0.18);
  float collars = pulseAA(across / 3.2, 0.14, fp / 3.2);
  float top = max(h.n.y, 0.0);
  float curve = sqrt(max(0.0, 1.0 - pow(h.n.y != 0.0 ? side / 0.7 : height / 0.75, 2.0)));
  vec3 metal = vec3(0.035, 0.10, 0.12) + vec3(0.07, 0.19, 0.20) * top;
  metal *= 0.6 + curve * 0.65;
  metal = mix(metal, vec3(0.11, 0.085, 0.055) * (0.7 + curve * 0.6), collars);
  float lips = pulseAA(across / 3.2, 0.018, fp / 3.2) + pulseAA(across / 3.2 - 0.122, 0.018, fp / 3.2);
  metal += vec3(0.16, 0.19, 0.2) * lips;
  float detail = 1.0 - smoothstep(0.18, 0.65, fp);
  if (detail > 0.0) {
    float grime = tnoise(vec3(across * 1.2, side * 2.0, height * 0.45));
    metal *= mix(1.0, 0.8 + grime * 0.35, detail);
    vec2 bolt = vec2(mod(across, 3.2) - 0.224, abs(h.n.y != 0.0 ? side : height) - 0.42);
    metal += vec3(0.3, 0.32, 0.34) * discAA(bolt, 0.075, fp) * detail;
    float wall = abs(across - (alongX ? c.x : c.y) - h.a.z);
    float marking = bandAA(wall - 0.9, 0.32, fp);
    metal = mix(metal, mix(vec3(0.025), vec3(0.5, 0.29, 0.06),
      pulseAA((across + height + side) * 2.2, 0.5, fp * 3.0)), marking * detail);
  }
  metal += vec3(0.08, 0.42, 0.48) * neonLine(abs(height) - 0.56, 0.09, fp);
  return themeEquipment(metal, p, h.n, pix);
}

// Street surface: dark asphalt with lane lines and traffic streaks on the avenues, and the pads
// of the boosters' light columns.
vec3 shadeGround(vec3 p, float pix) {
  ivec2 cell = ivec2(floor(p.xz / uCell));
  vec2 local = p.xz - (vec2(cell) + 0.5) * uCell;
  vec3 col = vec3(0.006, 0.006, 0.01);
  bool inside = all(greaterThanEqual(cell, ivec2(0))) && all(lessThan(cell, ivec2(int(uN))));
  if (!inside) return col;
  bool aveX = mod(float(cell.x), uAvenue.x) < 0.5;   // avenue running along z
  bool aveZ = mod(float(cell.y), uAvenue.y) < 0.5;   // avenue running along x
  if (aveX != aveZ) {
    float across = aveX ? local.x : local.y;
    float along = aveX ? p.z : p.x;
    float line = exp(-abs(abs(across) - 0.3) / max(0.08, pix)) * step(0.5, fract(along / 6.0));
    col += vec3(0.9, 0.7, 0.4) * line * 0.6;
    // Traffic: light streaks drifting along four lanes, white one way and red the other.
    float lane = floor(across / 3.0 + 2.0);
    if (lane >= 0.0 && lane < 4.0) {
      float dir = lane < 2.0 ? 1.0 : -1.0;
      float trafficTime = uCollapseActive > 0.5 ? 0.0 : uTime;
      float s = fract((along * 0.02 + dir * trafficTime * 0.6) + hash11(lane + float(cell.x * 7 + cell.y)));
      float car = smoothstep(0.0, 0.02, s) * smoothstep(0.1, 0.02, s) * exp(-abs(fract(across / 3.0) - 0.5) * 8.0);
      col += (dir > 0.0 ? vec3(1.0, 0.9, 0.8) : vec3(1.0, 0.1, 0.05)) * car * 2.5 * (1.0 - uGrowth * 0.9);
    }
  }
  col = themeGround(col, p, pix);
  if (texelFetch(uStreetInfo, cell, 0).z > 0.5) col = parkGround(p, local, pix);
  vec4 pad = texelFetch(uPads, cell, 0);
  if (pad.x > 0.0) col += padLight(local, pad, pix);
  if (uCollapseActive > 0.5 && uCollapsePortalActive < 0.5) {
    float rim = bandAA(length(p.xz - uCollapseHole.xy) - uCollapseHole.z - 0.8, 0.8, pix);
    col = mix(col, vec3(0.08, 0.085, 0.07), rim);

        texture(uSrc, vUv + vec2(0, -r.y)).rgb + texture(uSrc, vUv + vec2(0, r.y)).rgb) * 2.0;

const COMPOSITE = `
uniform sampler2D uScene, uBloom;
uniform float uBloomAmt, uStreak, uExposure, uCA, uGrain, uVignette, uSaturation, uContrast;
uniform float uFlash, uFade, uGlitch, uBloomNorm, uSpeed;
uniform vec3 uTint;
uniform vec2 uOut;

vec3 acesFitted(vec3 v) {
  // Stephen Hill's fit of the ACES RRT+ODT.
  const mat3 inM = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
  const mat3 outM = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
  v = inM * v;
  vec3 a = v * (v + 0.0245786) - 0.000090537;
  vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;

}
vec3 toSrgb(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }

vec3 sampleCA(sampler2D tex, vec2 uv, vec2 dir) {
  return vec3(texture(tex, uv + dir).r, texture(tex, uv).g, texture(tex, uv - dir).b);
}

void main() {
  vec2 uv = vUv;
  float T = uTime;
  if (uGlitch > 0.0) {
    float band = floor(uv.y * 28.0);
    float r = hash12(vec2(band, floor(T * 24.0)));
    if (r < uGlitch * 0.6) uv.x += (hash12(vec2(band * 1.7, floor(T * 31.0))) - 0.5) * 0.12 * uGlitch;

  vec2 dir = c * uCA * 2.0 + vec2(uGlitch * 0.012, 0.0);
  vec3 col = sampleCA(uScene, uv, dir);
  vec3 bloom = sampleCA(uBloom, uv, dir * 1.5) * uBloomNorm;

  if (uStreak > 0.0) {

    for (int i = -12; i <= 12; i++) {

  // stay black, so a drop reads as light hitting the scene rather than a grey veil over it.
  col *= uExposure * uTint * (1.0 + uFlash * 10.0);
  col += uFlash * uFlash * uFlash * 0.4;   // a white veil only on the peak frames
  col = acesFitted(col);

  if (uSpeed > 0.0) {

    float phase = fract(radius * 1.8 - T * (0.65 + uSpeed * 1.8) + hash12(vec2(lane, 7.0)));
    float dash = smoothstep(0.70, 0.82, phase) * (1.0 - smoothstep(0.96, 1.0, phase));
    float edge = smoothstep(0.38, 0.72, radius);

  float n = hash12(gl_FragCoord.xy + fract(T * 13.7) * 311.0);
  col += (n - 0.5) * uGrain * (1.0 - l * 0.6);

// This required display pass deliberately has no bloom, loops, scene library or film effects.
// It preserves readable HDR colour and chapter fades when a driver's optional effect fails.
const DISPLAY = `
uniform sampler2D uScene;
uniform float uExposure, uFlash, uFade, uSceneEncoded;
uniform vec3 uTint;
vec3 acesFitted(vec3 v) {
  const mat3 inM = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
  const mat3 outM = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
  v = inM * v;
  vec3 a = v * (v + 0.0245786) - 0.000090537;
  vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
  return clamp(outM * (a / b), 0.0, 1.0);

void main() {
  vec3 source = texture(uScene, vUv).rgb;
  source = vec3(source.r >= 0.0 ? min(source.r, 64.0) : 0.0,
                source.g >= 0.0 ? min(source.g, 64.0) : 0.0,
                source.b >= 0.0 ? min(source.b, 64.0) : 0.0);
  if(uSceneEncoded>0.5) source=source/max(vec3(0.025),vec3(1.0)-source);
  vec3 col = source * uExposure * uTint * (1.0 + uFlash * 10.0);
  col += uFlash * uFlash * uFlash * 0.4;
  col = acesFitted(col) * (1.0 - clamp(uFade, 0.0, 1.0));
  col = mix(col * 12.92, 1.055 * pow(col, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, col));
  fragColor = vec4(col, 1.0);
}`;

let down, up, composite, display, safeMode = false, bloomError = null, meshEffects = null;
let mips = [];
let bloomFor = null;   // size the mip chain was built for

function init({ safe = false, enhanced = false } = {}) {
  safeMode = !!safe;
  bloomError = null;
  display = program('post:display', DISPLAY, undefined, { library: false });
  meshEffects?.dispose();
  meshEffects=safeMode&&enhanced?GAME.meshPost.create():null;
  // Compatibility effects are separate small optional programs; the full post never starts here.
  down = safeMode ? null : program('post:down', DOWN, undefined, { optional: true, library: false });
  up = safeMode ? null : program('post:up', UP, undefined, { optional: true, library: false });
  composite = safeMode ? null : program('post:composite', COMPOSITE, undefined, { optional: true });
}

function status() {
  if(meshEffects)return meshEffects.status();
  const warnings = [down, up, composite].filter(p => p?.error).map(p => p.error.message);
  if (bloomError) warnings.push(bloomError.message);
  return {
    mode: safeMode ? 'safe' : composite?.error ? 'simple' : down?.error || up?.error || bloomError ? 'no-bloom' : 'full',
    bloom: mips.length > 0 && !bloomError && !!down?.uniforms && !!up?.uniforms && !down.error && !up.error && !composite?.error,
    display: safeMode || composite?.error ? 'simple' : composite?.uniforms ? 'full' : 'pending',
    warnings,
  };
}

function ensureSize(w, h) {
  if (bloomFor && bloomFor[0] === w && bloomFor[1] === h) return;
  mips.forEach(m => m.dispose());
  mips = [];
  let mw = w >> 1, mh = h >> 1;
  while (mips.length < 7 && mw >= 4 && mh >= 4) {
    mips.push(createTarget(mw, mh));
    mw >>= 1; mh >>= 1;
  }
  bloomFor = [w, h];
}

// Bloom + final composite of an HDR target to the canvas.
function present(src, p, t) {
  // Validate the required display first: context loss propagates before any allocations/draws.
  if (!display.check()) return;
  if(meshEffects) {meshEffects.present(src,p,t,display);return;}
  const full = !!composite?.check();
  const effects = full && !bloomError && down.check() && up.check();
  if (effects) {
    try { ensureSize(src.w, src.h); }
    catch (error) {
      if (error.code !== 'GFX_RESOURCE_FAILED') throw error;
      display.check(); // A simultaneous context loss must propagate instead of becoming bloom fallback.
      bloomError = error;
      mips.forEach(m => m.dispose()); mips = []; bloomFor = null;
    }
  }
  else if (mips.length) {
    mips.forEach(m => m.dispose()); mips = []; bloomFor = null;
  }
  const bloom = effects && mips.length > 0;
  gl.disable(gl.BLEND);
  let prev = src;
  if (bloom) mips.forEach((m, i) => {
    bindTarget(m);
    pass(down, { uSrc: prev, uTexel: [1 / prev.w, 1 / prev.h], uFirst: i === 0 ? 1 : 0 });
    prev = m;
  });

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);

      pass(up, { uSrc: mips[i + 1], uTexel: [1 / mips[i + 1].w, 1 / mips[i + 1].h], uRadius: 1.0 });
    }
  }

  bindTarget(null);
  pass(full ? composite : display, {
    // Accumulated mip0 holds the sum of all levels; normalising makes uBloomAmt a true mix.
    uScene: src, uBloom: bloom ? mips[0] : src, uBloomNorm: bloom ? 1 / mips.length : 1,
    uSceneEncoded:safeMode?1:0,
    uBloomAmt: bloom ? p.bloom : 0, uStreak: bloom ? p.streak : 0, uExposure: p.exposure,
    uCA: p.ca, uGrain: p.grain, uVignette: p.vignette, uSaturation: p.saturation, uContrast: p.contrast,
    uFlash: p.flash, uFade: p.fade, uGlitch: p.glitch, uSpeed: p.speed, uTint: p.tint,
    uTime: t, uOut: [gl.drawingBufferWidth, gl.drawingBufferHeight],
  });
}

GAME.post = { init, defaults, present, status };

})();

return GAME;
